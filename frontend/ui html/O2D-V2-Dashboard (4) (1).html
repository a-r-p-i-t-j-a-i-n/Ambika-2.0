  /* ---------------------------------------------------------------------
     Overlays: popover, modal, drawer, confirm, toast
     --------------------------------------------------------------------- */
  let openPopover = null;
  AP.popover = function (anchor, content, { width, align = 'right' } = {}) {
    if (openPopover) openPopover();
    const pop = h('div', { class: 'popover', role: 'menu' }, content);
    if (width) pop.style.width = width + 'px';
    document.body.appendChild(pop);
    const r = anchor.getBoundingClientRect();
    const pw = pop.offsetWidth, ph = pop.offsetHeight;
    let left = align === 'right' ? r.right - pw : r.left;
    left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
    let top = r.bottom + 6;
    if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 6);
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
    const onDoc = (e) => { if (!pop.contains(e.target) && !anchor.contains(e.target)) close(); };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    function close() {
      pop.remove(); document.removeEventListener('mousedown', onDoc); document.removeEventListener('keydown', onKey);
      window.removeEventListener('scroll', close, true); openPopover = null;
    }
    setTimeout(() => { document.addEventListener('mousedown', onDoc); document.addEventListener('keydown', onKey); window.addEventListener('scroll', close, true); });
    openPopover = close;
    const first = pop.querySelector('button, [tabindex]'); if (first) first.focus();
    return close;
  };
  AP.menu = function (anchor, items) {
    const box = h('div');
    let close;
    for (const it of items) {
      if (it === '-') { box.appendChild(h('div', { class: 'divider', style: { margin: '4px 0' } })); continue; }
      const b = h('button', { class: 'menu-item' + (it.danger ? ' danger' : ''), type: 'button', disabled: it.disabled, title: it.title || null, html: icon(it.icon || 'chevRight') });
      b.appendChild(document.createTextNode(it.label));
      b.addEventListener('click', () => { if (it.disabled) return; close(); it.onClick && it.onClick(); });
      box.appendChild(b);
    }
    close = AP.popover(anchor, box, { width: 220 });
  };

  function trapFocus(container, e) {
    if (e.key !== 'Tab') return;
    const f = $$('button:not([disabled]), [href], input:not([type=hidden]), select, textarea, [tabindex]:not([tabindex="-1"])', container).filter((x) => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  function overlayBase({ title, subtitle, body, actions = [], drawer = false, size = '' }) {
    const prevFocus = document.activeElement;
    const ov = h('div', { class: 'overlay' + (drawer ? ' drawer-ov' : '') });
    const box = h('div', { class: (drawer ? 'drawer ' : 'modal ') + size, role: 'dialog', 'aria-modal': 'true', 'aria-label': title });
    const closeBtn = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Close', html: icon('x') });
    const head = h('div', { class: 'modal-head' }, h('div', null, h('h3', null, title), subtitle ? h('p', null, subtitle) : null), closeBtn);
    const bodyEl = h('div', { class: 'modal-body' }, body);
    box.append(head, bodyEl);
    let foot = null;
    if (actions.length) {
      foot = h('div', { class: 'modal-foot' });
      for (const a of actions) {
        const b = h('button', { class: 'btn ' + (a.primary ? 'primary' : a.danger ? 'danger' : ''), type: 'button', disabled: a.disabled, title: a.title || null });
        if (a.icon) b.innerHTML = icon(a.icon);
        b.appendChild(document.createTextNode(a.label));
        b.addEventListener('click', async () => { const r = a.onClick ? await a.onClick(close, b) : true; if (r !== false) close(); });
        foot.appendChild(b);
      }
      box.appendChild(foot);
    }
    ov.appendChild(box);
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';
    const onKey = (e) => { if (e.key === 'Escape') close(); trapFocus(box, e); };
    document.addEventListener('keydown', onKey);
    ov.addEventListener('mousedown', (e) => { if (e.target === ov) close(); });
    closeBtn.addEventListener('click', () => close());
    let closed = false;
    function close() {
      if (closed) return; closed = true;
      ov.remove(); document.removeEventListener('keydown', onKey);
      if (!$('.overlay')) document.body.style.overflow = '';
      if (prevFocus && prevFocus.focus) prevFocus.focus();
    }
    setTimeout(() => { const f = $('input, select, textarea', bodyEl) || closeBtn; f.focus(); }, 30);
    return { close, el: box, body: bodyEl, foot };
  }
  AP.modal = (o) => overlayBase(o);
  AP.drawer = (o) => overlayBase(Object.assign({}, o, { drawer: true }));
  AP.confirm = ({ title, text, okLabel = 'Confirm', danger = false }) => new Promise((resolve) => {
    let result = false;
    const m = overlayBase({ title, body: h('p', { class: 'text-2' }, text), actions: [
      { label: 'Cancel', onClick: () => { result = false; } },
      { label: okLabel, primary: !danger, danger, onClick: () => { result = true; } },
    ] });
    const obs = new MutationObserver(() => { if (!document.body.contains(m.el)) { obs.disconnect(); resolve(result); } });
    obs.observe(document.body, { childList: true });
  });

  AP.toast = function (msg, { tone = 'ok', action, timeout = 4200 } = {}) {
    const box = $('#toasts') || document.body.appendChild(h('div', { class: 'toasts', id: 'toasts' }));
    const ic = { ok: 'check', warn: 'alert', danger: 'alert', info: 'info' }[tone] || 'info';
    const t = h('div', { class: 'toast ' + tone, role: 'status' }, h('div', { class: 't-ic', html: icon(ic, 15) }), h('div', { class: 't-msg' }, msg));
    if (action) t.appendChild(h('button', { type: 'button', onclick: () => { action.fn(); t.remove(); } }, action.label));
    box.appendChild(t);
    setTimeout(() => t.remove(), timeout);
  };

  /* ---------------------------------------------------------------------
     Forms
     --------------------------------------------------------------------- */
  // field({label, name, type, options:[{value,label}]|[str], value, required, hint, min, max, step, full, placeholder})
  AP.field = function (f) {
    const id = 'f-' + f.name + '-' + Math.random().toString(36).slice(2, 7);
    let input;
    if (f.type === 'select') {
      input = h('select', { class: 'select', id, name: f.name, required: f.required });
      if (f.placeholder) input.appendChild(h('option', { value: '' }, f.placeholder));
      for (const o of f.options || []) {
        const opt = typeof o === 'object' ? o : { value: o, label: o };
        input.appendChild(h('option', { value: opt.value, selected: String(opt.value) === String(f.value) }, opt.label));
      }
    } else if (f.type === 'textarea') {
      input = h('textarea', { class: 'input', id, name: f.name, required: f.required, placeholder: f.placeholder || '' });
      input.value = f.value || '';
    } else {
      input = h('input', { class: 'input', id, name: f.name, type: f.type || 'text', required: f.required, min: f.min, max: f.max, step: f.step, placeholder: f.placeholder || '', accept: f.accept });
      if (f.value != null && f.type !== 'file') input.value = f.value;
    }
    const label = h('label', { for: id }, f.label, f.required ? h('span', { class: 'req' }, '*') : null);
    return h('div', { class: 'field' + (f.full ? ' full' : ''), dataset: { name: f.name } }, label, input,
      f.hint ? h('div', { class: 'hint' }, f.hint) : null, h('div', { class: 'err' }, f.error || 'This field is required'));
  };
  AP.readForm = function (root) {
    const out = {}; let ok = true;
    for (const fld of $$('.field', root)) {
      const inp = $('input, select, textarea', fld); if (!inp) continue;
      const v = inp.type === 'file' ? (inp.files[0] ? inp.files[0].name : '') : inp.value.trim();
      let bad = inp.required && !v;
      if (!bad && inp.type === 'number' && v !== '') {
        const n = Number(v);
        if (isNaN(n) || (inp.min !== '' && n < Number(inp.min)) || (inp.max !== '' && n > Number(inp.max))) {
          bad = true; $('.err', fld).textContent = inp.max !== '' ? `Enter a value between ${inp.min || 0} and ${fmt.num(Number(inp.max))}` : `Enter a value of at least ${inp.min}`;
        }
      }
      fld.classList.toggle('invalid', bad);
      if (bad) ok = false;
      out[fld.dataset.name] = inp.type === 'number' && v !== '' ? Number(v) : v;
    }
    if (!ok) { const first = $('.field.invalid input, .field.invalid select, .field.invalid textarea', root); if (first) first.focus(); }
    return ok ? out : null;
  };

  /* ---------------------------------------------------------------------
     KPI card
     --------------------------------------------------------------------- */
  // kpi({label, value, unit, sub, icon, tone, delta:{value, goodWhenUp}, spark:[nums], onClick})
  AP.kpi = function (k) {
    const el = h('button', { class: 'kpi' + (k.tone ? ' tone-' + k.tone : ''), type: 'button', title: k.hint || (k.onClick ? 'Click to drill down' : '') });
    const valEl = h('div', { class: 'k-value' }, k.value, k.unit ? h('small', null, k.unit) : null);
    el.append(h('div', { class: 'k-top' }, h('span', { class: 'k-label' }, k.label), h('span', { class: 'k-icon', html: icon(k.icon || 'activity') })), valEl);
    const foot = h('div', { class: 'k-foot' });
    const subBox = h('div', { class: 'k-sub' });
    if (k.delta && isFinite(k.delta.value)) {
      const up = k.delta.value >= 0;
      const good = k.delta.goodWhenUp === false ? !up : up;
      const d = h('span', { class: 'delta ' + (good ? 'up' : 'down'), html: icon(up ? 'arrowUp' : 'arrowDown') });
      d.appendChild(document.createTextNode(Math.abs(k.delta.value).toFixed(0) + '%'));
      subBox.append(d, ' ');
    }
    if (k.sub) subBox.append(k.sub);
    foot.appendChild(subBox);
    if (k.spark && k.spark.length > 1) foot.appendChild(sparkline(k.spark, k.tone));
    el.appendChild(foot);
    if (k.onClick) el.addEventListener('click', k.onClick);
    return el;
  };
  function sparkline(vals, tone) {
    const w = 84, hgt = 28, max = Math.max(...vals), min = Math.min(...vals), rng = max - min || 1;
    const pts = vals.map((v, i) => [(i / (vals.length - 1)) * w, hgt - 3 - ((v - min) / rng) * (hgt - 6)]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const color = tone === 'danger' ? 'var(--st-critical)' : tone === 'ok' ? 'var(--st-good)' : 'var(--s1)';
    const svg = s('svg', { class: 'k-spark', viewBox: `0 0 ${w} ${hgt}`, 'aria-hidden': 'true' },
      s('path', { d: d + ` L${w} ${hgt} L0 ${hgt} Z`, style: `fill:${color};opacity:.10` }),
      s('path', { d, style: `fill:none;stroke:${color};stroke-width:2;stroke-linecap:round;stroke-linejoin:round` }));
    return svg;
  }

  /* ---------------------------------------------------------------------
     Data table
     --------------------------------------------------------------------- */
  /* opts: { columns:[{key,label,align,sortable,value(row),render(row),primary,hideCard,width}],
             rows, pageSize, search:true, searchPlaceholder, selectable, bulkActions:[{label,icon,onClick(rows)}],
             rowActions(row)->[...], onRowClick(row), expand(row)->Node, rowClass(row), exportName, toolbar:Node, empty } */
  AP.table = function (host, opts) {
    const st = { rows: opts.rows || [], q: '', sortKey: opts.sortKey || null, sortDir: opts.sortDir || 'desc', page: 0, size: opts.pageSize || 10, sel: new Set(), open: new Set() };
    const keyOf = opts.rowKey || ((r) => r.id);
    const root = h('div', { class: 'dt' });
    const searchIn = h('input', { class: 'input', type: 'search', placeholder: opts.searchPlaceholder || 'Search…', 'aria-label': 'Search table' });
    searchIn.addEventListener('input', () => { st.q = searchIn.value.trim().toLowerCase(); st.page = 0; render(); });
    const bulk = h('div', { class: 'dt-bulk' });
    const toolbar = h('div', { class: 'dt-toolbar' });
    if (opts.search !== false) toolbar.appendChild(h('div', { class: 'dt-search' }, iconEl('search'), searchIn));
    toolbar.appendChild(bulk);
    toolbar.appendChild(h('div', { class: 'spacer' }));
    if (opts.toolbar) toolbar.appendChild(opts.toolbar);
    if (opts.exportName) {
      const ex = h('button', { class: 'btn sm', type: 'button', html: icon('download') }); ex.appendChild(document.createTextNode('CSV'));
      ex.addEventListener('click', () => exportCsv()); toolbar.appendChild(ex);
    }
    const table = h('table', { class: 'table cards' });
    const wrap = h('div', { class: 'dt-wrap' }, table);
    const foot = h('div', { class: 'dt-foot' });
    root.append(toolbar, wrap, foot);
    host.appendChild(root);

    const val = (c, r) => (c.value ? c.value(r) : r[c.key]);
    function filtered() {
      let rows = st.rows;
      if (st.q) rows = rows.filter((r) => opts.columns.some((c) => { const v = val(c, r); return v != null && String(v).toLowerCase().includes(st.q); }) || (opts.searchExtra && String(opts.searchExtra(r)).toLowerCase().includes(st.q)));
      if (st.sortKey) {
        const c = opts.columns.find((x) => x.key === st.sortKey);
        if (c) rows = rows.slice().sort((a, b) => {
          const va = val(c, a), vb = val(c, b);
          const cmp = typeof va === 'number' && typeof vb === 'number' ? va - vb : String(va ?? '').localeCompare(String(vb ?? ''), 'en', { numeric: true });
          return st.sortDir === 'asc' ? cmp : -cmp;
        });
      }
      return rows;
    }
    function exportCsv() {
      const rows = filtered();
      const cols = opts.columns.filter((c) => c.label && c.export !== false);
      const esc = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      const csv = [cols.map((c) => esc(c.label)).join(',')].concat(rows.map((r) => cols.map((c) => esc(c.csv ? c.csv(r) : val(c, r))).join(','))).join('\r\n');
      const a = h('a', { href: URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })), download: opts.exportName + '.csv' });
      document.body.appendChild(a); a.click(); a.remove();
      AP.toast(`Exported ${rows.length} rows to ${opts.exportName}.csv (generated locally)`);
    }
    function render() {
      const rows = filtered();
      const pages = Math.max(1, Math.ceil(rows.length / st.size));
      st.page = Math.min(st.page, pages - 1);
      const view = rows.slice(st.page * st.size, st.page * st.size + st.size);
      clear(table);
      const thr = h('tr');
      if (opts.expand) thr.appendChild(h('th', { class: 'chk' }, h('span', { class: 'sr-only' }, 'Expand')));
      if (opts.selectable) {
        const all = h('input', { type: 'checkbox', 'aria-label': 'Select all on page' });
        all.checked = view.length > 0 && view.every((r) => st.sel.has(keyOf(r)));
        all.addEventListener('change', () => { view.forEach((r) => (all.checked ? st.sel.add(keyOf(r)) : st.sel.delete(keyOf(r)))); render(); });
        thr.appendChild(h('th', { class: 'chk' }, all));
      }
      for (const c of opts.columns) {
        const th = h('th', { class: [c.align === 'right' ? 'r' : c.align === 'center' ? 'c' : '', c.sortable !== false && c.label ? 'sortable' : '', st.sortKey === c.key ? 'sorted' : ''].join(' '), style: c.width ? { width: c.width } : null, scope: 'col' }, c.label || '');
        if (c.sortable !== false && c.label) {
          th.appendChild(h('span', { class: 'sort' }, st.sortKey === c.key ? (st.sortDir === 'asc' ? '▲' : '▼') : '↕'));

          th.addEventListener('click', () => { if (st.sortKey === c.key) st.sortDir = st.sortDir === 'asc' ? 'desc' : 'asc'; else { st.sortKey = c.key; st.sortDir = c.align === 'right' ? 'desc' : 'asc'; } render(); });

      }

      table.appendChild(h('thead', null, thr));
      const tb = h('tbody');
      const colCount = opts.columns.length + (opts.selectable ? 1 : 0) + (opts.rowActions ? 1 : 0) + (opts.expand ? 1 : 0);
      if (!view.length) tb.appendChild(h('tr', null, h('td', { colspan: colCount }, h('div', { class: 'empty', html: icon('search') }, opts.empty || 'No records match the current filters'))));
      for (const r of view) {
        const k = keyOf(r);
        const tr = h('tr', { class: 'row' + (opts.onRowClick ? ' clickable' : '') + (st.sel.has(k) ? ' selected' : '') + (st.open.has(k) ? ' open' : '') + (opts.rowClass ? ' ' + (opts.rowClass(r) || '') : '') });
        if (opts.expand) {
          const ex = h('button', { class: 'expander', type: 'button', 'aria-label': 'Expand row', 'aria-expanded': String(st.open.has(k)), html: icon('chevRight') });
          ex.addEventListener('click', (e) => { e.stopPropagation(); st.open.has(k) ? st.open.delete(k) : st.open.add(k); render(); });

        }
        if (opts.selectable) {
          const cb = h('input', { type: 'checkbox', 'aria-label': 'Select row' }); cb.checked = st.sel.has(k);
          cb.addEventListener('click', (e) => e.stopPropagation());
          cb.addEventListener('change', () => { cb.checked ? st.sel.add(k) : st.sel.delete(k); render(); });
          tr.appendChild(h('td', { class: 'chk' }, cb));
        }
        for (const c of opts.columns) {
          const td = h('td', { class: [c.align === 'right' ? 'r' : c.align === 'center' ? 'c' : '', c.primary ? 'primary' : '', c.hideCard ? 'hide-card' : ''].join(' '), 'data-label': c.label || '' });
          const out = c.render ? c.render(r) : val(c, r);
          append(td, [out == null || out === '' ? '—' : out]);

        }
        if (opts.rowActions) {
          const acts = opts.rowActions(r);
          const box = h('div', { class: 'row-actions' });
          for (const a of acts.filter((x) => x.inline)) {
            const b = h('button', { class: 'btn xs' + (a.primary ? ' primary' : ''), type: 'button', disabled: a.disabled, title: a.title || a.label, html: a.icon ? icon(a.icon) : '' });
            b.appendChild(document.createTextNode(a.label));
            b.addEventListener('click', (e) => { e.stopPropagation(); if (!a.disabled) a.onClick(); });
            box.appendChild(b);
          }
          const menuItems = acts.filter((x) => !x.inline);
          if (menuItems.length) {
            const mb = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Row actions', style: { width: '30px', height: '30px' }, html: icon('more') });
            mb.addEventListener('click', (e) => { e.stopPropagation(); AP.menu(mb, menuItems); });
            box.appendChild(mb);
          }
          tr.appendChild(h('td', { class: 'r actions' }, box));
        }
        if (opts.onRowClick) tr.addEventListener('click', () => opts.onRowClick(r));
        tb.appendChild(tr);
        if (opts.expand && st.open.has(k)) tb.appendChild(h('tr', { class: 'expand-row' }, h('td', { colspan: colCount }, opts.expand(r))));
      }
      table.appendChild(tb);

      // bulk bar
      clear(bulk);
      const selRows = st.rows.filter((r) => st.sel.has(keyOf(r)));
      bulk.classList.toggle('show', selRows.length > 0);
      if (selRows.length) {
        bulk.appendChild(document.createTextNode(`${selRows.length} selected`));
        for (const b of opts.bulkActions || []) {
          const btn = h('button', { class: 'btn xs', type: 'button', html: icon(b.icon || 'check') }); btn.appendChild(document.createTextNode(b.label));
          btn.addEventListener('click', () => b.onClick(selRows, () => { st.sel.clear(); render(); }));
          bulk.appendChild(btn);
        }
        const cl = h('button', { class: 'btn xs ghost', type: 'button' }, 'Clear'); cl.addEventListener('click', () => { st.sel.clear(); render(); }); bulk.appendChild(cl);
      }

      // footer + pager
      clear(foot);
      const from = rows.length ? st.page * st.size + 1 : 0, to = Math.min(rows.length, (st.page + 1) * st.size);
      foot.appendChild(h('span', null, `Showing ${from}–${to} of ${rows.length}` + (rows.length !== st.rows.length ? ` (filtered from ${st.rows.length})` : '')));

      const sizeSel = h('select', { 'aria-label': 'Rows per page' });
      for (const n of [5, 10, 25, 50]) sizeSel.appendChild(h('option', { value: n, selected: n === st.size }, `${n} / page`));
      sizeSel.addEventListener('change', () => { st.size = Number(sizeSel.value); st.page = 0; render(); });
      pager.appendChild(sizeSel);
      const mk = (label, p, dis, on) => { const b = h('button', { type: 'button', disabled: dis, class: on ? 'on' : '', 'aria-label': typeof label === 'string' ? 'Page ' + label : null }); if (typeof label === 'string') b.textContent = label; else b.appendChild(label); b.addEventListener('click', () => { st.page = p; render(); }); return b; };
      pager.appendChild(mk(iconEl('chevLeft', 14), st.page - 1, st.page === 0));
      const span = 2; let start = Math.max(0, st.page - span), end = Math.min(pages - 1, st.page + span);
      for (let p = start; p <= end; p++) pager.appendChild(mk(String(p + 1), p, false, p === st.page));
      pager.appendChild(mk(iconEl('chevRight', 14), st.page + 1, st.page >= pages - 1));
      foot.appendChild(pager);
    }
    render();
    return {
      setRows(rows) { st.rows = rows; const keys = new Set(rows.map(keyOf)); st.sel.forEach((k) => { if (!keys.has(k)) st.sel.delete(k); }); render(); },
      setSearch(q) { searchIn.value = q; st.q = q.toLowerCase(); st.page = 0; render(); },
      refresh: render, el: root,
      toggleOpen(k) { st.open.has(k) ? st.open.delete(k) : st.open.add(k); render(); },
    };
  };

  /* ---------------------------------------------------------------------
     Charts (SVG). Rules: one y-axis, thin marks, rounded data ends,
     2px surface gaps, hover tooltip by default, legend for ≥2 series,
     table view via chartCard. Colours are CSS variables (theme-aware).
     --------------------------------------------------------------------- */
  const tip = { el: null };
  function tooltipEl() {
    if (!tip.el) { tip.el = h('div', { class: 'tooltip', role: 'tooltip' }); document.body.appendChild(tip.el); }
    return tip.el;
  }
  // rows: [{color, value, label}] — values lead, labels follow; built with textContent
  AP.showTip = function (evt, title, rows, hint) {
    const t = tooltipEl(); clear(t);
    t.appendChild(h('div', { class: 'tt-title' }, title));
    for (const r of rows) t.appendChild(h('div', { class: 'tt-row' }, h('i', { style: { background: r.color || 'var(--text-muted)' } }), h('b', null, r.value), h('span', null, r.label)));
    if (hint) t.appendChild(h('div', { class: 'tt-hint' }, hint));
    t.classList.add('show');
    const pad = 14, w = t.offsetWidth, ht = t.offsetHeight;
    let x = evt.clientX + pad, y = evt.clientY + pad;
    if (x + w > window.innerWidth - 8) x = evt.clientX - w - pad;
    if (y + ht > window.innerHeight - 8) y = evt.clientY - ht - pad;
    t.style.left = Math.max(8, x) + 'px'; t.style.top = Math.max(8, y) + 'px';
  };
  AP.hideTip = function () { if (tip.el) tip.el.classList.remove('show'); };

  function niceMax(v) {
    if (v <= 0) return 1;
    const exp = Math.pow(10, Math.floor(Math.log10(v)));
    const f = v / exp;
    const nf = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
    return nf * exp;
  }
  function roundTopRect(x, y, w, hgt, r) {
    if (hgt <= 0) return '';
    r = Math.min(r, w / 2, hgt);
    return `M${x},${y + hgt} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + hgt} Z`;
  }
  function roundRightRect(x, y, w, hgt, r) {
    if (w <= 0) return '';
    r = Math.min(r, hgt / 2, w);
    return `M${x},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + hgt - r} Q${x + w},${y + hgt} ${x + w - r},${y + hgt} L${x},${y + hgt} Z`;
  }
  function legend(series, kind) {
    const lg = h('div', { class: 'legend' });
    for (const sr of series) lg.appendChild(h('span', null, h('i', { class: kind === 'line' ? 'line' : '', style: { background: sr.color } }), sr.name));
    return lg;
  }
  function responsive(host, draw) {
    let lastW = 0;
    const run = () => { const w = host.clientWidth; if (w && w !== lastW) { lastW = w; draw(w); } };
    if ('ResizeObserver' in window) new ResizeObserver(run).observe(host); else window.addEventListener('resize', run);
    run();
    if (!lastW) setTimeout(run, 50);
  }

  /* Vertical grouped/stacked bars.
     o: {categories, series:[{name,color,values}], height, stacked, fmt, onClick(i), selected, hint} */
  AP.barChart = function (host, o) {
    clear(host);
    const wrap = h('div', { class: 'chart' });
    if (o.series.length > 1) host.appendChild(legend(o.series));
    host.appendChild(wrap);
    const vf = o.fmt || fmt.compact;
    responsive(wrap, (W) => {
      clear(wrap);
      const H = o.height || 240, m = { t: 10, r: 8, b: 26, l: 44 };
      const iw = W - m.l - m.r, ih = H - m.t - m.b;
      const n = o.categories.length;
      const totals = o.categories.map((_, i) => o.stacked ? o.series.reduce((a, sr) => a + (sr.values[i] || 0), 0) : Math.max(...o.series.map((sr) => sr.values[i] || 0)));
      const max = niceMax(Math.max(...totals, 1) * 1.05);
      const y = (v) => m.t + ih - (v / max) * ih;
      const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', 'aria-label': o.ariaLabel || 'Bar chart' });
      for (let i = 0; i <= 4; i++) {
        const v = (max / 4) * i, yy = y(v);
        svg.appendChild(s('line', { x1: m.l, x2: W - m.r, y1: yy, y2: yy, class: i === 0 ? 'base-line' : 'grid-line' }));
        svg.appendChild(s('text', { x: m.l - 8, y: yy + 4, 'text-anchor': 'end', class: 'axis-text' }, vf(v)));
      }
      const band = iw / n, inner = Math.min(band * 0.72, o.stacked ? 44 : 22 * o.series.length + 2 * (o.series.length - 1));
      const showEvery = Math.ceil(n / Math.max(1, Math.floor(iw / 46)));
      o.categories.forEach((cat, i) => {
        const bx = m.l + band * i;
        const g = s('g', { class: 'mark-group' });
        const bandRect = s('rect', { x: bx + 1, y: m.t, width: band - 2, height: ih, rx: 6, class: 'band' + (o.selected === i ? ' sel' : ''), tabindex: 0, role: 'button', 'aria-label': `${cat}: ` + o.series.map((sr) => `${sr.name} ${vf(sr.values[i] || 0)}`).join(', ') });
        g.appendChild(bandRect);
        const x0 = bx + (band - inner) / 2;
        if (o.stacked) {
          let acc = 0;
          o.series.forEach((sr, si) => {
            const v = sr.values[i] || 0; if (!v) return;
            const y1 = y(acc + v), y0 = y(acc);
            const isTop = o.series.slice(si + 1).every((x) => !(x.values[i] > 0));
            const hh = Math.max(0, y0 - y1 - (acc > 0 ? 2 : 0));
            const d = isTop ? roundTopRect(x0, y1, inner, hh, 4) : `M${x0},${y1} h${inner} v${hh} h${-inner} Z`;
            g.appendChild(s('path', { d, class: 'mark', style: `fill:${sr.color}` }));
            acc += v;
          });
        } else {
          const bw = (inner - 2 * (o.series.length - 1)) / o.series.length;
          o.series.forEach((sr, si) => {
            const v = sr.values[i] || 0, yy = y(v);
            g.appendChild(s('path', { d: roundTopRect(x0 + si * (bw + 2), yy, bw, m.t + ih - yy, 4), class: 'mark', style: `fill:${sr.color}` }));
          });
        }
        if (i % showEvery === 0) g.appendChild(s('text', { x: bx + band / 2, y: H - 8, 'text-anchor': 'middle', class: 'axis-text' }, cat));
        const show = (e) => {
          const rows = o.series.map((sr) => ({ color: sr.color, value: vf(sr.values[i] || 0), label: sr.name }));
          if (o.extraTip) rows.push(...o.extraTip(i));
          AP.showTip(e, cat, rows, o.onClick ? (o.hint || 'Click to filter') : null);
        };
        bandRect.addEventListener('pointermove', show);
        bandRect.addEventListener('pointerleave', AP.hideTip);
        bandRect.addEventListener('focus', () => { const r = bandRect.getBoundingClientRect(); show({ clientX: r.left + r.width / 2, clientY: r.top + 20 }); });
        bandRect.addEventListener('blur', AP.hideTip);
        if (o.onClick) {
          bandRect.addEventListener('click', () => { AP.hideTip(); o.onClick(i); });
          bandRect.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); o.onClick(i); } });
        }
        // the band must sit under marks visually but receive events: put marks pointer-events none
        g.querySelectorAll('.mark').forEach((mk) => mk.setAttribute('pointer-events', 'none'));
        svg.appendChild(g);
      });
      wrap.appendChild(svg);
    });
  };

  /* Horizontal bars (single series, ranked, or stacked with series).
     o: {items:[{label, value, color, sub}] } or {categories, series, stacked:true}; fmt; onClick(i); ordinal */
  AP.hBarChart = function (host, o) {
    clear(host);
    const stacked = !!o.series;
    if (stacked && o.series.length > 1) host.appendChild(legend(o.series));
    const wrap = h('div', { class: 'chart' });
    host.appendChild(wrap);
    const vf = o.fmt || fmt.compact;
    const cats = stacked ? o.categories : o.items.map((x) => x.label);
    responsive(wrap, (W) => {
      clear(wrap);
      const rowH = o.rowHeight || 30, gap = 8;
      const labelW = Math.min(o.labelWidth || 150, W * 0.42);
      const valueW = stacked ? 44 : 64;
      const H = cats.length * (rowH + gap) - gap + 4;
      const iw = Math.max(40, W - labelW - valueW - 12);
      const totals = stacked ? cats.map((_, i) => o.series.reduce((a, sr) => a + (sr.values[i] || 0), 0)) : o.items.map((x) => x.value);
      const max = o.max || Math.max(...totals, 1);
      const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', 'aria-label': o.ariaLabel || 'Bar chart' });
      cats.forEach((cat, i) => {
        const y0 = i * (rowH + gap);
        const g = s('g');
        const hit = s('rect', { x: 0, y: y0 - 2, width: W, height: rowH + 4, rx: 6, class: 'band', tabindex: 0, role: o.onClick ? 'button' : 'img', 'aria-label': `${cat}: ${vf(totals[i])}` });
        g.appendChild(hit);
        const lbl = cat.length > 24 && labelW < 170 ? cat.slice(0, 22) + '…' : cat;
        g.appendChild(s('text', { x: 0, y: y0 + rowH / 2 + 4, class: 'label-text' }, lbl));
        const bh = Math.min(16, rowH - 10), by = y0 + (rowH - bh) / 2;
        g.appendChild(s('rect', { x: labelW, y: by, width: iw, height: bh, rx: 4, style: 'fill:var(--surface-3)', 'pointer-events': 'none' }));
        if (stacked) {
          let acc = 0;
          o.series.forEach((sr, si) => {
            const v = sr.values[i] || 0; if (!v) return;
            const x = labelW + (acc / max) * iw + (acc > 0 ? 2 : 0);
            const w = Math.max(0, (v / max) * iw - (acc > 0 ? 2 : 0));
            const isEnd = o.series.slice(si + 1).every((x2) => !(x2.values[i] > 0));
            g.appendChild(s('path', { d: isEnd ? roundRightRect(x, by, w, bh, 4) : `M${x},${by} h${w} v${bh} h${-w} Z`, class: 'mark', style: `fill:${sr.color}`, 'pointer-events': 'none' }));
            acc += v;
          });
        } else {
          const it = o.items[i];
          g.appendChild(s('path', { d: roundRightRect(labelW, by, Math.max(2, (it.value / max) * iw), bh, 4), class: 'mark', style: `fill:${it.color || 'var(--s1)'}`, 'pointer-events': 'none' }));
        }
        g.appendChild(s('text', { x: W, y: y0 + rowH / 2 + 4, 'text-anchor': 'end', class: 'value-text' }, vf(totals[i])));
        const show = (e) => {
          const rows = stacked ? o.series.map((sr) => ({ color: sr.color, value: vf(sr.values[i] || 0), label: sr.name })) : [{ color: o.items[i].color || 'var(--s1)', value: vf(o.items[i].value), label: o.items[i].sub || o.valueLabel || '' }];
          AP.showTip(e, cat, rows, o.onClick ? (o.hint || 'Click for details') : null);
        };
        hit.addEventListener('pointermove', show);
        hit.addEventListener('pointerleave', AP.hideTip);
        hit.addEventListener('focus', () => { const r = hit.getBoundingClientRect(); show({ clientX: r.left + labelW, clientY: r.top }); });
        hit.addEventListener('blur', AP.hideTip);
        if (o.onClick) {
          hit.addEventListener('click', () => { AP.hideTip(); o.onClick(i); });
          hit.addEventListener('keydown', (e) => { if (e.key === 'Enter') o.onClick(i); });
        }
        svg.appendChild(g);
      });
      wrap.appendChild(svg);
    });
  };

  /* Line chart with crosshair. o: {categories, series:[{name,color,values}], height, fmt, yMax, area, target:{value,label}} */
  AP.lineChart = function (host, o) {
    clear(host);
    if (o.series.length > 1) host.appendChild(legend(o.series, 'line'));
    const wrap = h('div', { class: 'chart' });
    host.appendChild(wrap);
    const vf = o.fmt || fmt.compact;
    responsive(wrap, (W) => {
      clear(wrap);
      const H = o.height || 200, m = { t: 12, r: 12, b: 26, l: 44 };
      const iw = W - m.l - m.r, ih = H - m.t - m.b, n = o.categories.length;
      const max = o.yMax || niceMax(Math.max(...o.series.flatMap((sr) => sr.values), 1) * 1.1);
      const x = (i) => m.l + (n === 1 ? iw / 2 : (iw * i) / (n - 1));
      const y = (v) => m.t + ih - (Math.min(v, max) / max) * ih;
      const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', 'aria-label': o.ariaLabel || 'Line chart' });
      for (let i = 0; i <= 4; i++) {
        const v = (max / 4) * i, yy = y(v);
        svg.appendChild(s('line', { x1: m.l, x2: W - m.r, y1: yy, y2: yy, class: i === 0 ? 'base-line' : 'grid-line' }));
        svg.appendChild(s('text', { x: m.l - 8, y: yy + 4, 'text-anchor': 'end', class: 'axis-text' }, vf(v)));
      }
      if (o.target) {
        const ty = y(o.target.value);
        svg.appendChild(s('line', { x1: m.l, x2: W - m.r, y1: ty, y2: ty, style: 'stroke:var(--text-muted);stroke-width:1;stroke-dasharray:4 4' }));
        svg.appendChild(s('text', { x: W - m.r, y: ty - 5, 'text-anchor': 'end', class: 'axis-text' }, o.target.label));
      }
      const showEvery = Math.ceil(n / Math.max(1, Math.floor(iw / 52)));
      o.categories.forEach((c, i) => { if (i % showEvery === 0 || i === n - 1) svg.appendChild(s('text', { x: x(i), y: H - 8, 'text-anchor': 'middle', class: 'axis-text' }, c)); });
      o.series.forEach((sr) => {
        const d = sr.values.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
        if (o.area) svg.appendChild(s('path', { d: d + ` L${x(n - 1)} ${y(0)} L${x(0)} ${y(0)} Z`, style: `fill:${sr.color};opacity:.10` }));
        svg.appendChild(s('path', { d, style: `fill:none;stroke:${sr.color};stroke-width:2;stroke-linejoin:round;stroke-linecap:round` }));
        // end-point direct label marker
        const li = sr.values.length - 1;
        svg.appendChild(s('circle', { cx: x(li), cy: y(sr.values[li]), r: 4, style: `fill:${sr.color};stroke:var(--chart-surface);stroke-width:2` }));
      });
      const cross = s('line', { y1: m.t, y2: m.t + ih, style: 'stroke:var(--text-muted);stroke-width:1;opacity:0', 'pointer-events': 'none' });
      const dots = o.series.map((sr) => s('circle', { r: 5, style: `fill:${sr.color};stroke:var(--chart-surface);stroke-width:2;opacity:0`, 'pointer-events': 'none' }));
      svg.appendChild(cross); dots.forEach((d) => svg.appendChild(d));
      const hit = s('rect', { x: m.l, y: m.t, width: iw, height: ih, style: 'fill:transparent', tabindex: 0, 'aria-label': 'Chart values — use the table view for exact numbers' });
      const move = (e) => {
        const r = svg.getBoundingClientRect();
        const px = ((e.clientX - r.left) / r.width) * W;
        const i = Math.max(0, Math.min(n - 1, Math.round(((px - m.l) / iw) * (n - 1))));

  <script>
/* ==========================================================================
   Deterministic sample-data generator (fictional).
   Builds sales orders → dispatch phases → delivery challans → invoices →
   payments, and an O2D FMS process per order whose step timings follow the
   real engine rule: planned = previous step's actual + SLA.
   All dates are relative to "today", and the dataset is saved to
   localStorage so demo actions persist. Reset restores this baseline.
   ========================================================================== */
(function () {
  'use strict';
  const AP = window.AP;
  const M = AP.MASTERS;
  const MIN = 60000, HOUR = 3600000, DAY = 86400000;
  const VERSION = 4;
  const KEY = 'o2d-data-v' + VERSION;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function generate(now) {
    const rnd = mulberry32(20261104);
    const R = {
      int: (a, b) => a + Math.floor(rnd() * (b - a + 1)),
      float: (a, b) => a + rnd() * (b - a),
      pick: (arr) => arr[Math.floor(rnd() * arr.length)],
      chance: (p) => rnd() < p,
    };
    const STEPS = M.o2dSteps;
    const sku = (id) => M.skus.find((s) => s.id === id);
    const at = (dayStart, hh, mm) => dayStart + hh * HOUR + (mm || 0) * MIN;
    const sod = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };

    // lateness model (minutes relative to planned; negative = early)
    function lateness(sla) {
      if (R.chance(0.74)) return -R.float(0.05, 0.6) * Math.max(sla, 30);
      if (sla <= 120) return R.float(0.25, 1.8) * Math.max(sla, 45);
      if (sla <= 1440) return R.float(0.1, 0.5) * sla;
      return R.float(0.3, 2.5) * 1440;
    }

    const N = 48;
    const orders = [], processes = [], challans = [];
    const special = { cancelled: [21, N - 8], shortClosed: [9], ahead: [6], stuck: { [N - 5]: '2.03', [N - 3]: '2.04', [N - 12]: '2.05' }, lacking: new Set([30, 34, 37, 40]) };

    for (let i = 0; i < N; i++) {
      const ageDays = Math.pow(1 - i / N, 1.25) * 150 + R.float(0, 1.5);
      const receivedAt = at(sod(now - ageDays * DAY), R.int(9, 17), R.int(0, 59));
      const party = M.parties[(i * 7 + R.int(0, 3)) % M.parties.length];
      const lineCount = R.chance(0.35) ? 1 : R.chance(0.7) ? 2 : 3;
      const usedSku = new Set();
      const lines = [];
      for (let l = 0; l < lineCount; l++) {
        let s; do { s = R.pick(M.skus); } while (usedSku.has(s.id)); usedSku.add(s.id);
        const qty = R.int(6, 70) * 50;
        lines.push({ skuId: s.id, qty, rate: s.rate });
      }
      const o = {
        id: 'o' + (i + 1), soNo: '', poNo: `${party.code}/PO/${R.int(1100, 2900)}`, partyId: party.id,
        receivedAt, channel: R.pick(M.intakeChannels.slice(0, 3)), lines, phases: [], status: 'RECEIVED',
        createdBy: R.chance(0.7) ? 'u2' : 'u7', closedAt: null, remarks: '',
      };
      const isCancelled = special.cancelled.includes(i);
      const isShort = special.shortClosed.includes(i);
      const stuckCode = special.stuck[i];

      // ---- process: pre-dispatch steps (1.01 → 2.05)
      const steps = STEPS.map((st) => ({ code: st.code, status: 'NOT_STARTED', plannedAt: null, actualAt: null, delayMins: 0, doerId: st.doer, buddyId: st.buddy, checklist: [], remarks: '' }));
      let prev = receivedAt, k = 0, stopped = false;
      for (; k < 5; k++) {
        const st = STEPS[k], step = steps[k];
        const planned = k === 0 ? receivedAt : prev + st.slaMin * MIN;
        let actual = k === 0 ? receivedAt + R.int(2, 15) * MIN : planned + lateness(st.slaMin) * MIN;
        if (actual < prev + 5 * MIN) actual = prev + R.int(5, 25) * MIN;
        step.plannedAt = planned;
        const tooRecent = actual > now - 10 * MIN || (now - receivedAt < 20 * HOUR && k > 1 && R.chance(0.35));
        if (st.code === stuckCode || tooRecent) { step.status = 'PENDING'; stopped = true; break; }
        step.actualAt = actual; step.delayMins = Math.max(0, (actual - planned) / MIN);
        step.status = step.delayMins > 0 ? 'DELAYED' : 'DONE';
        step.checklist = st.checklist.map(() => R.chance(0.96));
        prev = actual;
      }

      // ---- dispatch plan (phases) once 2.04 is done
      const plan04 = steps[3];
      if (plan04.actualAt) {
        let phaseId = 0;
        lines.forEach((ln, li) => {
          const nPh = ln.qty >= 2500 ? 3 : ln.qty >= 900 && R.chance(0.6) ? 2 : 1;
          let day = sod(plan04.actualAt) + R.int(2, 5) * DAY;
          let remaining = ln.qty;
          for (let p = 1; p <= nPh; p++) {
            const q = p === nPh ? remaining : Math.round((ln.qty / nPh) / 50) * 50;
            remaining -= q;
            o.phases.push({ id: o.id + '-ph' + ++phaseId, lineIdx: li, skuId: ln.skuId, phaseNo: p, plannedDate: day + 11 * HOUR, plannedQty: q, actualQty: 0, lastDispatchAt: null });
            day += R.int(3, 5) * DAY;
          }
        });
      }

      // ---- actual dispatches → delivery challans
      if (!isCancelled) {
        const lacking = special.lacking.has(i);
        o.phases.forEach((ph, pi) => {
          const due = ph.plannedDate;
          let qty = 0, when = null;
          if (due < now - 1 * DAY) {
            if (isShort && pi === o.phases.length - 1) qty = 0;
            else if (lacking && pi === o.phases.length - 1) qty = R.chance(0.5) ? 0 : Math.round(ph.plannedQty * R.float(0.4, 0.8) / 50) * 50;
            else if (R.chance(0.08) && now - due < 20 * DAY) qty = 0; // slipped phase → overdue
            else if (R.chance(0.12) && now - due < 25 * DAY) qty = Math.round(ph.plannedQty * R.float(0.5, 0.9) / 50) * 50;
            else qty = ph.plannedQty;
            when = Math.min(due + R.int(-1, 2) * DAY + R.int(-3, 6) * HOUR, now - 3 * HOUR);
          } else if (due < now + 2 * DAY && R.chance(0.15)) {
            qty = ph.plannedQty; when = now - R.int(3, 20) * HOUR;
          }
          if (special.ahead.includes(i) && pi === o.phases.length - 1) qty = ph.plannedQty + 100;
          if (qty > 0) {
            ph.actualQty = qty; ph.lastDispatchAt = when;
            const tType = R.chance(0.6) ? 'Freight Paid' : R.chance(0.6) ? 'To Pay' : 'Party Vehicle';
            challans.push({
              id: 'c' + (challans.length + 1), dcNo: '', orderId: o.id, phaseId: ph.id, skuId: ph.skuId, qty, dispatchedAt: when,
              vehicleNo: `MH-${R.pick(['04', '12', '15', '43', '48'])}-${R.pick(['AB', 'BT', 'CJ', 'DK', 'GQ'])}-${R.int(1000, 9899)}`,
              transporter: tType === 'Party Vehicle' ? 'Party Vehicle' : R.pick(M.transporters), transportType: tType,
              lrNo: tType === 'Party Vehicle' ? '' : 'LR' + R.int(40000, 89999),
              invoice: null, deliveryStatus: 'DISPATCHED', deliveredAt: null, received: 0, receivedAt: null, billReceived: false, billPaid: false, unplanned: false,
            });
          }
        });
      }

      const ordered = lines.reduce((a, l) => a + l.qty, 0);
      const myChallans = challans.filter((c) => c.orderId === o.id);
      const dispatched = myChallans.reduce((a, c) => a + c.qty, 0);
      const lastDispatch = myChallans.reduce((a, c) => Math.max(a, c.dispatchedAt), 0);

      // ---- step 2.06 (quantity-gated) and post-dispatch chain
      if (!stopped && k >= 5 && !isCancelled) {
        const s06 = steps[5];
        s06.plannedAt = prev + STEPS[5].slaMin * MIN;
        const closed = dispatched >= ordered || isShort;
        if (closed && myChallans.length) {
          const act = isShort ? lastDispatch + R.int(2, 6) * DAY : lastDispatch;
          s06.actualAt = Math.max(act, prev + HOUR);
          s06.delayMins = Math.max(0, (s06.actualAt - s06.plannedAt) / MIN);
          s06.status = s06.delayMins > 0 ? 'DELAYED' : 'DONE';
          s06.checklist = STEPS[5].checklist.map(() => true);
          if (isShort) { o.closedAt = s06.actualAt; s06.remarks = 'Short closed — balance cancelled by client'; }
          prev = s06.actualAt;
          for (let j = 6; j < STEPS.length; j++) {
            const st = STEPS[j], step = steps[j];
            step.plannedAt = prev + st.slaMin * MIN;
            let actual = step.plannedAt + lateness(st.slaMin) * MIN;
            if (st.code === '2.10') actual = prev + R.int(18, 40) * DAY; // credit period: client pays within ~3–6 weeks
            if (actual < prev + 5 * MIN) actual = prev + R.int(8, 40) * MIN;
            const stuckPay = st.code === '2.10' && R.chance(0.12);
            if (actual > now || stuckPay) { step.status = 'PENDING'; break; }
            step.actualAt = actual; step.delayMins = Math.max(0, (actual - step.plannedAt) / MIN);
            step.status = step.delayMins > 0 ? 'DELAYED' : 'DONE';
            step.checklist = st.checklist.map(() => R.chance(0.95));
            prev = actual;
          }
        } else {
          s06.status = myChallans.length ? 'IN_PROGRESS' : 'PENDING';
        }
      }
      if (isCancelled) {
        steps.forEach((s) => { if (s.status === 'NOT_STARTED' || s.status === 'PENDING' || s.status === 'IN_PROGRESS') { s.status = 'SKIPPED'; s.plannedAt = s.plannedAt || null; } });
        o.status = 'CANCELLED'; o.closedAt = (steps.filter((s) => s.actualAt).pop() || { actualAt: receivedAt }).actualAt + R.int(1, 3) * DAY;
        o.remarks = 'Cancelled by client — revised requirement';
      }

      // ---- challan downstream fields (invoice / delivery / payment / transport bill)
      const done = (code) => ['DONE', 'DELAYED'].includes(steps.find((s) => s.code === code).status);
      for (const c of myChallans) {
        if (done('2.07') || c.dispatchedAt < now - 3 * HOUR) {
          const amt = Math.round(c.qty * sku(c.skuId).rate * 1.18);
          c.invoice = { no: '', invoiceDate: c.dispatchedAt + R.int(20, 150) * MIN, amount: amt };
        }
        if (done('2.09') || (c.invoice && c.dispatchedAt < now - 3 * DAY)) {
          c.deliveryStatus = 'DELIVERED'; c.deliveredAt = Math.min(now - HOUR, c.dispatchedAt + R.int(1, 3) * DAY);
        }
        if (c.invoice && (done('2.11') || (c.deliveredAt && c.deliveredAt < now - 35 * DAY && R.chance(0.7)))) {
          c.received = c.invoice.amount; c.receivedAt = Math.min(now - HOUR, (c.deliveredAt || c.dispatchedAt) + R.int(12, 34) * DAY);
        }
        c.billReceived = done('2.12') || (c.deliveredAt && c.deliveredAt < now - 20 * DAY && c.transportType === 'Freight Paid');
        c.billPaid = done('2.13');
      }

      if (o.status !== 'CANCELLED') {
        if (isShort) o.status = 'SHORT_CLOSED';
        else if (!o.phases.length) o.status = 'RECEIVED';
        else if (!dispatched) o.status = 'PLANNING';
        else if (dispatched < ordered) o.status = 'IN_PROGRESS';
        else o.status = 'COMPLETED';
      }
      const allDone = steps.every((s) => ['DONE', 'DELAYED', 'SKIPPED'].includes(s.status));
      orders.push(o);
      processes.push({ id: 'pr' + (i + 1), orderId: o.id, catalog: 'CURRENT_SHEET', createdAt: receivedAt, status: o.status === 'CANCELLED' ? 'CANCELLED' : allDone ? 'COMPLETED' : 'IN_PROGRESS', steps, history: [] });
    }

    // ---- document numbering (FY 26-27), in date order
    orders.slice().sort((a, b) => a.receivedAt - b.receivedAt).forEach((o, i) => { o.soNo = `AGL/SO/26-27/${String(121 + i).padStart(4, '0')}`; });
    challans.slice().sort((a, b) => a.dispatchedAt - b.dispatchedAt).forEach((c, i) => { c.dcNo = `AGL/DC/26-27/${String(301 + i).padStart(4, '0')}`; });
    challans.filter((c) => c.invoice).sort((a, b) => a.invoice.invoiceDate - b.invoice.invoiceDate).forEach((c, i) => { c.invoice.no = `AGL/TI/26-27/${String(288 + i).padStart(4, '0')}`; });

    // ---- order intake register: recent un-converted + converted
    const intakes = [];
    const recent = orders.slice(-10);
    recent.forEach((o, i) => intakes.push({ id: 'in' + (i + 1), no: `INT-${String(540 + i).padStart(4, '0')}`, partyId: o.partyId, channel: o.channel, items: o.lines.map((l) => ({ skuId: l.skuId, qty: l.qty })), loggedAt: o.receivedAt - R.int(20, 180) * MIN, loggedBy: o.createdBy, status: 'CONVERTED', orderId: o.id, notes: '' }));
    const newOnes = [
      { partyId: 'p05', channel: 'WhatsApp', items: [{ skuId: 's03', qty: 1200 }, { skuId: 's07', qty: 800 }], ago: 3.2, notes: 'Wants first lot before Diwali week' },
      { partyId: 'p11', channel: 'Phone call', items: [{ skuId: 's04', qty: 600 }], ago: 6.5, notes: 'Rate as per last PO' },
      { partyId: 'p13', channel: 'Email', items: [{ skuId: 's09', qty: 450 }, { skuId: 's06', qty: 900 }], ago: 20, notes: '' },
      { partyId: 'p02', channel: 'Meeting', items: [{ skuId: 's01', qty: 1500 }], ago: 27, notes: 'Trade-show enquiry, confirm packing spec' },
    ];
    newOnes.forEach((n, i) => intakes.push({ id: 'in' + (11 + i), no: `INT-${String(550 + i).padStart(4, '0')}`, partyId: n.partyId, channel: n.channel, items: n.items, loggedAt: now - n.ago * HOUR, loggedBy: i % 2 ? 'u7' : 'u2', status: 'NEW', orderId: null, notes: n.notes }));
    intakes.push({ id: 'in15', no: 'INT-0554', partyId: 'p16', channel: 'Phone call', items: [{ skuId: 's12', qty: 300 }], loggedAt: now - 52 * HOUR, loggedBy: 'u2', status: 'CANCELLED', orderId: null, notes: 'Client dropped requirement' });

    const purchaseEvents = M.purchase.events.map((e) => ({ type: e.type, ref: e.ref, who: e.who, text: e.text, t: now - e.ago * MIN }));

    return { version: VERSION, genAt: now, orders, processes, challans, intakes, activity: [], purchaseEvents };
  }

  // shift every timestamp so the dataset stays relative to "today"
  function shift(obj, delta) {
    if (Array.isArray(obj)) { obj.forEach((x) => shift(x, delta)); return; }
    if (!obj || typeof obj !== 'object') return;
    for (const k of Object.keys(obj)) {
      const v = obj[k];
      if (typeof v === 'number' && (k === 't' || /(At|Date)$/.test(k)) && k !== 'genAt') obj[k] = v + delta;
      else if (v && typeof v === 'object') shift(v, delta);
    }
  }

  let db = null;
  function load() {
    const now = Date.now();
    const saved = AP.store.get(KEY, null);
    if (saved && saved.version === VERSION && saved.orders) {
      const delta = now - saved.genAt;
      if (Math.abs(delta) > HOUR) { shift(saved, delta); saved.genAt = now; }
      db = saved;
    } else {
      db = generate(now);
    }
    AP.store.set(KEY, db);
    return db;
  }

  AP.data = {
    get db() { return db || load(); },
    people: M.people,
    save() { AP.store.set(KEY, db); document.dispatchEvent(new CustomEvent('ap:data')); },
    reset() { AP.store.remove(KEY); db = null; },
  };
})();

</script>
  <script>
/* ==========================================================================
   O2D domain engine (local simulation of Ambika 2.0 o2d-fms rules)
   - planned = previous step's actual (or order received) + SLA
   - delay = max(0, actual − planned); DONE vs DELAYED (done late)
   - "Overdue" is derived: PENDING/IN_PROGRESS with planned < now
   - 2.06 is quantity-gated: it closes only when the order balance is 0
   - Dispatch health: dispatched − ordered (Lacking / Ahead / On Track / Pending)
   - MIS = −(late×2 + overdue×5 + delay hours + checklist misses)
   ========================================================================== */
(function () {
  'use strict';
  const AP = window.AP;
  const M = AP.MASTERS;
  const MIN = 60000, HOUR = 3600000, DAY = 86400000;
  const db = () => AP.data.db;

  const O = (AP.o2d = {});
  O.STEPS = M.o2dSteps;
  O.step = (code) => O.STEPS.find((s) => s.code === code);
  O.party = (id) => M.parties.find((p) => p.id === id) || { name: '—', city: '' };
  O.sku = (id) => M.skus.find((s) => s.id === id) || { name: '—', code: '' };
  O.order = (id) => db().orders.find((o) => o.id === id);
  O.processOf = (o) => db().processes.find((p) => p.orderId === o.id);
  O.challansOf = (o) => db().challans.filter((c) => c.orderId === o.id);
  O.isDone = (st) => st === 'DONE' || st === 'DELAYED';
  O.isOpen = (st) => st === 'PENDING' || st === 'IN_PROGRESS';
  const sod = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };

  /* ---------- orders & phases ---------- */
  O.metrics = function (o) {
    const ordered = o.lines.reduce((a, l) => a + l.qty, 0);
    const dispatched = o.phases.reduce((a, p) => a + p.actualQty, 0);
    const planned = o.phases.reduce((a, p) => a + p.plannedQty, 0);
    const today = sod(Date.now()) + DAY;
    const dueQty = o.phases.filter((p) => p.plannedDate < today).reduce((a, p) => a + p.plannedQty, 0);
    const value = o.lines.reduce((a, l) => a + l.qty * l.rate, 0);
    const closed = ['SHORT_CLOSED', 'CANCELLED'].includes(o.status);
    return {
      ordered, dispatched, planned, dueQty, value,
      balance: closed ? 0 : Math.max(0, ordered - dispatched),
      openBalance: Math.max(0, ordered - dispatched),
      fulfil: ordered ? (dispatched / ordered) * 100 : 0,
      adherence: dueQty ? Math.min(100, (Math.min(dispatched, dueQty) / dueQty) * 100) : null,
      variance: dispatched - ordered,
    };
  };
  O.health = function (o) {
    if (o.status === 'CANCELLED') return 'CANCELLED';
    const m = O.metrics(o);
    if (m.dispatched === 0) return 'PENDING';
    if (m.variance < 0) return o.status === 'SHORT_CLOSED' ? 'ON_TRACK' : 'LACKING';
    if (m.variance > 0) return 'AHEAD';
    return 'ON_TRACK';
  };
  O.phaseStatus = function (ph, o) {
    if (o.status === 'CANCELLED') return 'CANCELLED';
    if (ph.actualQty >= ph.plannedQty) return 'DISPATCHED';
    if (o.status === 'SHORT_CLOSED') return 'CANCELLED';
    if (ph.plannedDate < sod(Date.now())) return 'DELAYED';
    if (ph.actualQty > 0) return 'IN_PROGRESS';
    return 'PLANNED';
  };
  O.phaseDelayDays = (ph) => Math.max(0, Math.floor((sod(Date.now()) - sod(ph.plannedDate)) / DAY));
  O.allPhases = function (orders) {
    const out = [];
    for (const o of orders || db().orders) {
      const byLine = {};
      for (const ph of o.phases) {
        const prev = byLine[ph.lineIdx];
        const carry = prev && prev.plannedDate < sod(Date.now()) ? Math.max(0, prev.plannedQty + (prev._carry || 0) - prev.actualQty) : 0;
        ph._carry = carry;
        byLine[ph.lineIdx] = ph;
        const status = O.phaseStatus(ph, o);
        out.push({ id: ph.id, order: o, phase: ph, sku: O.sku(ph.skuId), party: O.party(o.partyId), status, effective: ph.plannedQty + carry, pending: Math.max(0, ph.plannedQty + carry - ph.actualQty), delayDays: status === 'DELAYED' ? O.phaseDelayDays(ph) : 0 });
      }
    }
    return out;
  };

  /* ---------- steps ---------- */
  // display state for a step
  O.stepState = function (step, now = Date.now()) {
    if (step.status === 'DONE') return 'DONE';
    if (step.status === 'DELAYED') return 'DONE_LATE';
    if (step.status === 'SKIPPED') return 'SKIPPED';
    if (step.status === 'NOT_STARTED') return 'NOT_STARTED';
    if (step.plannedAt && step.plannedAt < now) return 'OVERDUE';
    if (step.status === 'IN_PROGRESS') return 'IN_PROGRESS';
    if (step.plannedAt && step.plannedAt - now < 24 * HOUR) return 'DUE_SOON';
    return 'PENDING';
  };
  O.overdueMins = (step, now = Date.now()) => (O.isOpen(step.status) && step.plannedAt && step.plannedAt < now ? (now - step.plannedAt) / MIN : 0);
  O.currentStep = (proc) => proc.steps.find((s) => O.isOpen(s.status)) || null;
  O.progress = (proc) => {
    const active = proc.steps.filter((s) => s.status !== 'SKIPPED');
    return active.length ? (active.filter((s) => O.isDone(s.status)).length / active.length) * 100 : 0;
  };
  O.chipFor = function (step) {
    const st = O.stepState(step);
    if (st === 'NOT_STARTED') return AP.toneChip('neutral', 'Waiting');
    if (step.code === '2.06' && step.status === 'IN_PROGRESS') {
      const proc = db().processes.find((p) => p.steps.includes(step));
      const m = O.metrics(O.order(proc.orderId));
      const label = `${AP.fmt.pct(m.fulfil)} dispatched`;
      return st === 'OVERDUE' ? AP.toneChip('danger', 'Overdue · ' + label) : AP.toneChip('info', 'In progress · ' + label);
    }
    return AP.chip(st);
  };
  O.challanProgress = function (o, code) {
    const cs = O.challansOf(o);
    if (!cs.length) return null;
    if (code === '2.07') return `${cs.filter((c) => c.invoice).length}/${cs.length} invoiced`;
    if (code === '2.09') return `${cs.filter((c) => c.deliveryStatus === 'DELIVERED').length}/${cs.length} delivered`;
    if (code === '2.11') return `${cs.filter((c) => c.received > 0).length}/${cs.length} paid`;
    return null;
  };

  /* ---------- MIS scoring (o2d-fms MisScoring.jsx) ---------- */
  O.grade = (score) => (score >= 0 ? 'A+' : score >= -10 ? 'A' : score >= -25 ? 'B' : score >= -50 ? 'C' : 'D');
  O.mis = function (from, to, now = Date.now()) {
    const rows = {};
    for (const p of M.people.filter((x) => x.role !== 'MD' && x.role !== 'VIEWER')) rows[p.id] = { personId: p.id, assigned: 0, completed: 0, onTime: 0, late: 0, overdue: 0, delayMins: 0, chkDone: 0, chkTotal: 0 };
    for (const proc of db().processes) {
      if (proc.status === 'CANCELLED') continue;
      for (const s of proc.steps) {
        const r = rows[s.doerId]; if (!r || !s.plannedAt) continue;
        if (O.isDone(s.status) && s.actualAt >= from && s.actualAt <= to) {
          r.assigned++; r.completed++;
          if (s.status === 'DONE') r.onTime++; else { r.late++; r.delayMins += s.delayMins; }
          r.chkTotal += s.checklist.length; r.chkDone += s.checklist.filter(Boolean).length;
        } else if (O.isOpen(s.status) && s.plannedAt <= to) {
          r.assigned++;
          if (s.plannedAt < now) r.overdue++;
        }
      }
    }
    return Object.values(rows).map((r) => {
      const misses = r.chkTotal - r.chkDone;
      const delayH = Math.round(r.delayMins / 60);
      const score = 0 - (r.late * 2 + r.overdue * 5 + delayH + misses) || 0;
      return Object.assign(r, { misses, delayH, score, grade: O.grade(score), punctuality: r.completed ? (r.onTime / r.completed) * 100 : null, accuracy: r.chkTotal ? (r.chkDone / r.chkTotal) * 100 : null, avgDelayH: r.late ? r.delayMins / 60 / r.late : 0 });
    }).sort((a, b) => b.score - a.score);
  };

  /* ---------- permissions on a step ---------- */
  O.canAct = function (step) {
    if (!AP.can('o2dfms.act')) return { ok: false, why: 'Your role is read-only' };
    if (AP.can('o2dfms.manage')) return { ok: true };
    const me = AP.ROLES[AP.role()].personId;
    if (step.doerId === me || step.buddyId === me) return { ok: true };
    return { ok: false, why: 'Only the assigned doer, buddy or a manager can complete this step' };
  };

  /* ---------- activity ---------- */
  const me = () => AP.ROLES[AP.role()].personId;
  O.log = function (type, ref, text) {
    db().activity.unshift({ type, ref, text, by: me(), t: Date.now() });
    db().activity = db().activity.slice(0, 60);
  };
  O.activityFeed = function (limit = 12) {
    const D = db(), ev = [];
    for (const a of D.activity) ev.push({ type: a.type, title: a.ref, text: a.text, t: a.t, by: a.by });
    for (const o of D.orders) ev.push({ type: 'Order', title: `${o.soNo} · ${O.party(o.partyId).name}`, text: `Sales order received · ${AP.fmt.num(O.metrics(o).ordered)} pcs`, t: o.receivedAt });
    for (const c of D.challans) {
      const o = O.order(c.orderId);
      ev.push({ type: 'Dispatch', title: `${c.dcNo} · ${O.party(o.partyId).name}`, text: `${AP.fmt.num(c.qty)} pcs ${O.sku(c.skuId).name} dispatched`, t: c.dispatchedAt });
      if (c.receivedAt) ev.push({ type: 'Payment', title: `${c.invoice.no} · ${O.party(o.partyId).name}`, text: `Payment received · ${AP.fmt.money(c.received)}`, t: c.receivedAt });
    }
    for (const e of D.purchaseEvents) ev.push({ type: e.type === 'GRN' ? 'GRN' : 'Purchase', title: `${e.ref} · ${e.who}`, text: e.text, t: e.t });
    return ev.filter((e) => e.t <= Date.now()).sort((a, b) => b.t - a.t).slice(0, limit);
  };

  /* ---------- numbering ---------- */
  function nextNo(prefix, values) {
    const nums = values.map((v) => parseInt(String(v || '').split('/').pop(), 10)).filter((n) => !isNaN(n));
    return `${prefix}/${String((nums.length ? Math.max(...nums) : 0) + 1).padStart(4, '0')}`;
  }

  /* ---------- mutations (local only) ---------- */
  function startNext(proc, idx, now) {
    const nxt = proc.steps[idx + 1];
    if (!nxt) { proc.status = 'COMPLETED'; return null; }
    if (nxt.status === 'NOT_STARTED' || nxt.status === 'PENDING') {
      nxt.status = 'PENDING'; nxt.plannedAt = now + O.step(nxt.code).slaMin * MIN;
    }
    return nxt;
  }

  O.completeStep = function (proc, code, { checklist = [], remarks = '', fields = {} } = {}) {
    const now = Date.now();
    const idx = proc.steps.findIndex((s) => s.code === code);
    const step = proc.steps[idx];
    const o = O.order(proc.orderId);
    step.actualAt = now;
    step.delayMins = Math.max(0, (now - (step.plannedAt || now)) / MIN);
    step.status = step.delayMins > 0 ? 'DELAYED' : 'DONE';
    step.checklist = checklist; step.remarks = remarks; step.completedBy = me();
    const cs = O.challansOf(o);

    if (code === '2.04') {
      const first = fields.firstDate ? new Date(fields.firstDate + 'T11:00:00').getTime() : sod(now) + 3 * DAY + 11 * HOUR;
      const nPh = Math.max(1, Math.min(4, Number(fields.phaseCount) || 1));
      const gap = Math.max(1, Number(fields.gapDays) || 4);
      o.phases = [];
      o.lines.forEach((ln, li) => {
        let rem = ln.qty;
        for (let p = 1; p <= nPh; p++) {
          const q = p === nPh ? rem : Math.round(ln.qty / nPh / 50) * 50; rem -= q;
          o.phases.push({ id: `${o.id}-ph${o.phases.length + 1}`, lineIdx: li, skuId: ln.skuId, phaseNo: p, plannedDate: first + (p - 1) * gap * DAY, plannedQty: q, actualQty: 0, lastDispatchAt: null });

    if (code === '2.07') {
      let first = true;
      for (const c of cs) if (!c.invoice) {
        const no = first && fields.invoiceNo ? fields.invoiceNo : nextNo('AGL/TI/26-27', db().challans.map((x) => x.invoice && x.invoice.no));
        c.invoice = { no, invoiceDate: now, amount: first && fields.amount ? Number(fields.amount) : Math.round(c.qty * O.sku(c.skuId).rate * 1.18) };
        if (fields.transporter) c.transporter = fields.transporter;
        if (fields.lrNo) c.lrNo = fields.lrNo;
        first = false;
      }
    }
    if (code === '2.09') for (const c of cs) if (c.deliveryStatus !== 'DELIVERED') { c.deliveryStatus = 'DELIVERED'; c.deliveredAt = now; }
    if (code === '2.11') for (const c of cs) if (c.invoice && !c.received) { c.received = c.invoice.amount; c.receivedAt = now; }
    if (code === '2.12') cs.forEach((c) => (c.billReceived = true));
    if (code === '2.13') cs.forEach((c) => (c.billPaid = true));

    proc.history.push({ t: now, text: `${code} ${O.step(code).short} marked ${step.status === 'DONE' ? 'done on time' : 'done late (' + AP.fmt.dur(step.delayMins) + ')'}`, by: me() });
    const nxt = startNext(proc, idx, now);
    O.log('O2D', `${o.soNo} · ${code}`, `${O.step(code).short} completed${step.status === 'DELAYED' ? ' late' : ''}${nxt ? ' → ' + nxt.code + ' ' + O.step(nxt.code).short + ' started' : ' · process completed'}`);
    AP.data.save();
    return { step, next: nxt };
  };

  O.recordDispatch = function (o, phaseId, qty, info = {}) {
    const now = Date.now();
    const ph = o.phases.find((p) => p.id === phaseId);
    ph.actualQty += qty; ph.lastDispatchAt = now;
    const c = {
      id: 'c' + (db().challans.length + 1) + '-' + now.toString(36), dcNo: nextNo('AGL/DC/26-27', db().challans.map((x) => x.dcNo)),
      orderId: o.id, phaseId, skuId: ph.skuId, qty, dispatchedAt: now, vehicleNo: info.vehicleNo || '', transporter: info.transporter || '',
      transportType: info.transportType || 'Freight Paid', lrNo: info.lrNo || '', invoice: null, deliveryStatus: 'DISPATCHED', deliveredAt: null,
      received: 0, receivedAt: null, billReceived: false, billPaid: false, unplanned: false,
    };
    db().challans.push(c);
    const m = O.metrics(o);
    if (['RECEIVED', 'PLANNING'].includes(o.status)) o.status = 'IN_PROGRESS';
    if (m.dispatched >= m.ordered) o.status = 'COMPLETED';
    const proc = O.processOf(o);
    const idx = proc.steps.findIndex((s) => s.code === '2.06');
    const s06 = proc.steps[idx];
    if (O.isOpen(s06.status)) {
      if (m.dispatched >= m.ordered) {
        s06.actualAt = now; s06.delayMins = Math.max(0, (now - s06.plannedAt) / MIN);
        s06.status = s06.delayMins > 0 ? 'DELAYED' : 'DONE'; s06.checklist = O.step('2.06').checklist.map(() => true); s06.completedBy = me();
        startNext(proc, idx, now);
        proc.history.push({ t: now, text: '2.06 closed — order balance is 0', by: me() });
      } else s06.status = 'IN_PROGRESS';
    }
    O.log('Dispatch', `${c.dcNo} · ${O.party(o.partyId).name}`, `${AP.fmt.num(qty)} pcs ${O.sku(ph.skuId).name} dispatched (phase ${ph.phaseNo})`);
    AP.data.save();
    return c;
  };

  O.reassign = function (proc, code, doerId, reason) {
    const step = proc.steps.find((s) => s.code === code);
    const from = step.doerId; step.doerId = doerId;
    proc.history.push({ t: Date.now(), text: `${code} reassigned from ${(AP.person(from) || {}).name} to ${(AP.person(doerId) || {}).name}${reason ? ' — ' + reason : ''}`, by: me() });
    O.log('O2D', `${O.order(proc.orderId).soNo} · ${code}`, `Doer changed to ${(AP.person(doerId) || {}).name}`);
    AP.data.save();
  };

  O.createIntake = function ({ partyId, channel, items, notes }) {
    const D = db();
    const no = 'INT-' + String(Math.max(...D.intakes.map((x) => parseInt(x.no.slice(4), 10))) + 1).padStart(4, '0');
    const it = { id: 'in' + Date.now().toString(36), no, partyId, channel, items, loggedAt: Date.now(), loggedBy: me(), status: 'NEW', orderId: null, notes: notes || '' };
    D.intakes.unshift(it);
    O.log('Order', `${no} · ${O.party(partyId).name}`, `Order intake logged via ${channel}`);
    AP.data.save();
    return it;
  };

  O.createOrder = function ({ partyId, poNo, lines, channel, intakeId }) {
    const D = db(), now = Date.now();
    const o = {
      id: 'o' + Date.now().toString(36), soNo: nextNo('AGL/SO/26-27', D.orders.map((x) => x.soNo)), poNo: poNo || '', partyId, receivedAt: now,
      channel: channel || 'Phone call', lines: lines.map((l) => ({ skuId: l.skuId, qty: l.qty, rate: O.sku(l.skuId).rate })), phases: [], status: 'RECEIVED', createdBy: me(), closedAt: null, remarks: '',
    };
    D.orders.push(o);
    const steps = O.STEPS.map((st) => ({ code: st.code, status: 'NOT_STARTED', plannedAt: null, actualAt: null, delayMins: 0, doerId: st.doer, buddyId: st.buddy, checklist: [], remarks: '' }));
    steps[0].status = 'DONE'; steps[0].plannedAt = now; steps[0].actualAt = now; steps[0].checklist = O.step('1.01').checklist.map(() => true);
    steps[1].status = 'PENDING'; steps[1].plannedAt = now + O.step('2.02').slaMin * MIN;
    D.processes.push({ id: 'pr' + Date.now().toString(36), orderId: o.id, catalog: 'CURRENT_SHEET', createdAt: now, status: 'IN_PROGRESS', steps, history: [{ t: now, text: '1.01 Order Received — process started (trigger ORDER_ENTRY)', by: me() }] });
    if (intakeId) { const it = D.intakes.find((x) => x.id === intakeId); if (it) { it.status = 'CONVERTED'; it.orderId = o.id; } }
    O.log('Order', `${o.soNo} · ${O.party(partyId).name}`, `Sales order created · ${AP.fmt.num(O.metrics(o).ordered)} pcs`);
    AP.data.save();
    return o;
  };

  O.cancelOrder = function (o, reason) {
    o.status = 'CANCELLED'; o.closedAt = Date.now(); o.remarks = reason;
    const proc = O.processOf(o);
    proc.steps.forEach((s) => { if (!O.isDone(s.status)) s.status = 'SKIPPED'; });
    proc.status = 'CANCELLED';
    proc.history.push({ t: Date.now(), text: 'Order cancelled — ' + reason, by: me() });
    O.log('Order', `${o.soNo} · ${O.party(o.partyId).name}`, 'Order cancelled — ' + reason);
    AP.data.save();
  };

  /* ---------- notifications for the bell ---------- */
  O.notifications = function () {
    const mine = AP.can('o2dfms.manage') ? null : me();
    const out = [];
    for (const proc of db().processes) {
      const s = O.currentStep(proc); if (!s) continue;
      const om = O.overdueMins(s); if (!om) continue;
      if (mine && s.doerId !== mine && s.buddyId !== mine) continue;
      const o = O.order(proc.orderId);
      out.push({ icon: 'alert', title: `${s.code} ${O.step(s.code).short} overdue`, sub: `${o.soNo} · ${O.party(o.partyId).name} · ${AP.fmt.dur(om)} late`, mins: om, orderId: o.id });
    }
    return out.sort((a, b) => b.mins - a.mins);
  };
})();
