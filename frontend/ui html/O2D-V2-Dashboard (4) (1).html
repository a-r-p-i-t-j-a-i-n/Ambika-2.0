  function saWindow() {
    const now = Date.now();
    if (stg.time === 'weekly') return [now - 7 * DAY, now + DAY];
    if (stg.time === 'custom') {
      const f = stg.from ? new Date(stg.from + 'T00:00:00').getTime() : 0;
      const t = stg.to ? new Date(stg.to + 'T23:59:59').getTime() : now;
      return [f, t];
    }
    const d = new Date();
    return [new Date(d.getFullYear(), d.getMonth(), 1).getTime(), now + DAY];
  }
  function paintStage() {
    const [from, to] = saWindow();
    const todayStart = sodT(Date.now());
    const sumBy = {};
    const inView = new Set(filtered(true).map((r) => r.o.id));
    ALL.forEach((r) => {
      if (!inView.has(r.o.id)) return;
      if (r.o.receivedAt < from || r.o.receivedAt > to) return;
      if (stg.so && r.o.id !== stg.so) return;
      if (stg.party && r.o.partyId !== stg.party) return;
      r.o.phases.forEach((ph) => {
        const pending = Math.max(0, ph.plannedQty - ph.actualQty);
        const v = stg.mode === 'pending' ? pending
          : stg.mode === 'dispatched' ? ph.actualQty
          : (ph.plannedDate >= todayStart ? pending : 0);
        if (v) sumBy[ph.skuId] = (sumBy[ph.skuId] || 0) + v;
      });
    });
    const rows = Object.keys(sumBy).map((k) => [k, sumBy[k]]).sort((a, b) => b[1] - a[1]).slice(0, 10);
    const max = Math.max(1, ...rows.map((x) => x[1]));
    const total = rows.reduce((a, x) => a + x[1], 0);
    const bars = rows.map(([sku, v], i) => {
      const sk = O.sku(sku);
      const on = state.sku === sku;
      const col = SKU_COLORS[i % SKU_COLORS.length];
      const hpx = Math.max(6, Math.round(v / max * 100));
      return h('button', { class: 'p-bar' + (on ? ' on' : '') + '', type: 'button', title: (sk.name || sku) + ': ' + fmt.num(v),
        onclick: () => toggleSku(sku) },
        h('span', { class: 'pc' }, fmt.num(v)),
        h('span', { class: 'col', style: { height: hpx + '%', background: `linear-gradient(180deg, ${col}, ${col}aa)` } }),
        h('span', { class: 'tag', style: { background: col + '26', color: col } }, sk.name || sku));
    });
    clear(stageCard);
    stageCard.append(
      h('div', { class: 'p-ch', style: { alignItems: 'center' } }, h('h3', null, 'Stage analysis'), saBar),
      h('div', { class: 'p-bars', style: { gridTemplateColumns: `repeat(${Math.max(1, rows.length)}, minmax(0,120px))`, justifyContent: 'center' } },
        bars.length ? bars : h('div', { class: 'ss', style: { padding: '40px 12px', gridColumn: '1 / -1', textAlign: 'center', lineHeight: '1.6' } },
          inView.size === 0 ? 'No orders in this view.'
          : stg.mode === 'pending' ? 'Nothing pending in these orders (all dispatched). Choose "2. Dispatched" to see the quantity.'
          : stg.mode === 'dispatched' ? 'Nothing dispatched yet in this view.'
          : 'No upcoming dispatch plan in this view.')));
  }

  /* ---------- 3. Row 2: Overview | Calendar | Date legends ---------- */
  const row2 = h('div', { class: 'p-row2' });
  stack.append(row2);
  const overviewCard = h('div', { class: 'p-card' });
  const calCard = h('div', { class: 'p-card' });
  const legendCard = h('div', { class: 'p-card' });
  row2.append(overviewCard, calCard);

  const monthBase = new Date();
  const Y = monthBase.getFullYear(), M = monthBase.getMonth();
  const TODAY = sodT(Date.now());

  function filtered(skipSku) {
    return ALL.filter((r) =>
      (!state.group || (state.group === 'PENDING' ? (r.group === 'OPEN' || r.group === 'OVERDUE') : state.group === 'CLOSED' ? (r.group === 'COMPLETED' || r.group === 'CANCELLED') : r.group === state.group)) &&
      ((kpiSel !== 'challan' && kpiSel !== 'dispatchToday') || challanToday(r)) &&
      (kpiSel !== 'dispatched' || r.m.dispatched > 0) &&
      (!state.step || (r.cur && r.cur.code === state.step)) &&
      (skipSku || !state.sku || r.o.lines.some((l) => l.skuId === state.sku)) &&
      (!state.phase || r.phase === state.phase) &&
      (state.day === null || (r.cur && r.cur.plannedAt && sodT(r.cur.plannedAt) === state.day)));
  }

  function paintOverview(list) {
    const cnt = (g) => ALL.filter((r) => r.group === g).length;
    const GO = { Total: null, Completed: 'COMPLETED', Delayed: 'OVERDUE', Cancelled: 'CANCELLED' };
    const stats = [
      { l: 'Total', v: ALL.filter((r) => r.group !== 'CANCELLED').length, bg: '#eef4fd' },
      { l: 'Completed', v: cnt('COMPLETED'), bg: '#eefaf3' },
      { l: 'Delayed', v: cnt('OVERDUE'), bg: '#fdf0f2' },
      { l: 'Cancelled', v: cnt('CANCELLED'), bg: '#f2f4f8' },
    ];
    const upcoming = list.filter((r) => r.cur && (r.group === 'OPEN' || r.group === 'OVERDUE'))
      .sort((a, b) => ((a.cur.plannedAt || a.o.receivedAt) - (b.cur.plannedAt || b.o.receivedAt))).slice(0, 14);
    const items = upcoming.map((r, i) => {
      const tm = h('span', { class: 'tm' }, fmt.dateShort(r.cur.plannedAt || r.o.receivedAt));
      const av = h('span', { class: 'av', style: { background: AVATAR[i % AVATAR.length] } }, fmt.initials((AP.person(r.cur.doerId) || {}).name || '?'));
      const mid = h('span', { style: { minWidth: 0 } },
        h('div', { class: 'nm' }, O.party(r.o.partyId).name),
        h('div', { class: 'ss' }, r.cur.code + ' ' + O.step(r.cur.code).short));
      const st = h('span', { class: 'p-st', style: { background: GR[r.group] }, html: icon(r.group === 'OVERDUE' ? 'clock' : 'activity', 12) });
      return h('button', { type: 'button', class: 'p-item', onclick: () => openOrder(r) }, tm, av, mid, st);
    });
    clear(overviewCard);
    overviewCard.append(
      h('div', { class: 'p-ch' }, h('div', null, h('h3', null, 'Quick Overview'))),
      h('div', { class: 'p-stats4' }, stats.map((s) => {
        const g = GO[s.l];
        const on = g ? state.group === g : (!state.group && viaLabel === 'All orders');
        return h('button', { type: 'button', class: 'p-stat' + (on ? ' on' : ''), style: { background: s.bg }, 'aria-pressed': String(on),
          onclick: () => (g ? toggleGroup(g) : reset()) }, h('div', { class: 'l' }, s.l), h('div', { class: 'v' }, s.v));
      })),
      h('div', { class: 'p-list' }, items.length ? items : h('div', { class: 'ss', style: { padding: '10px' } }, 'No open orders in this view')));
  }

  const cal = { y: new Date().getFullYear(), m: new Date().getMonth() };
  let calPick = false;
  const MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  // Planned quantity for one day, grouped by party (from the order phases)
  function dayPlan(ts) {
    const byParty = {};
    ALL.forEach((r) => r.o.phases.forEach((ph) => {
      if (!ph.plannedQty || sodT(ph.plannedDate) !== ts) return;
      const p = byParty[r.o.partyId] || (byParty[r.o.partyId] = { party: O.party(r.o.partyId).name, lines: {}, total: 0 });
      p.lines[ph.skuId] = (p.lines[ph.skuId] || 0) + ph.plannedQty;
      p.total += ph.plannedQty;
    }));
    return Object.values(byParty);
  }
  function openDay(ts) {
    const plan = dayPlan(ts);
    const dateTxt = new Date(ts).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    const body = plan.length ? h('div', null, plan.map((p) => h('div', { class: 'dp-card' },
      h('div', { class: 'dp-h' }, h('span', null, p.party), h('b', null, fmt.num(p.total) + ' pcs')),
      Object.entries(p.lines).map(([sku, q]) => h('div', { class: 'dp-l' }, h('span', null, O.sku(sku).name), h('span', null, fmt.num(q)))),
      h('div', { class: 'dp-t' }, h('span', null, 'TOTAL'), h('span', null, fmt.num(p.total) + ' pcs'))))) : h('div', { class: 'ss' }, 'Nothing planned on this day.');
    AP.drawer({ title: 'Dispatch plan · ' + dateTxt, subtitle: plan.length + ' party' + (plan.length === 1 ? '' : 'ies'), body, actions: [{ label: 'Close' }] });
  }
  function paintCalendar() {
    const { y, m } = cal;
    const first = new Date(y, m, 1).getDay();
    const offset = (first + 6) % 7;
    const days = new Date(y, m + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < offset; i++) cells.push(null);
    for (let d = 1; d <= days; d++) cells.push(d);
    const monthName = new Date(y, m, 1).toLocaleString('en-US', { month: 'long', year: 'numeric' });
    const move = (delta) => () => { let mm = cal.m + delta, yy = cal.y; if (mm < 0) { mm = 11; yy--; } if (mm > 11) { mm = 0; yy++; } cal.y = yy; cal.m = mm; paint(); };
    const goToday = () => { const n = new Date(); cal.y = n.getFullYear(); cal.m = n.getMonth(); paint(); };
    const grid = h('div', { class: 'p-cal' },
      ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'].map((w) => h('div', { class: 'wd' }, w)),
      cells.map((d) => {
        if (!d) return h('span', { class: 'dd out' });
        const ts = new Date(y, m, d).getTime();
        const plan = dayPlan(ts);
        const sel = state.day === ts;
        return h('button', { type: 'button', class: 'dd' + (sel ? ' sel' : '') + (ts === TODAY ? ' today' : ''),
          onclick: () => { toggleDay(ts); if (state.day === ts) openDay(ts); } },
          h('span', { class: 'dn' }, d),
          plan.slice(0, 2).map((p) => h('span', { class: 'ev', style: { background: '#fdecec', color: '#b91c1c' } }, p.party + ' · ' + fmt.num(p.total))),
          plan.length > 2 ? h('span', { class: 'more' }, '+' + (plan.length - 2) + ' more') : null);
      }));
    // Month picker: click the month to choose any month of any year
    const pop = calPick ? h('div', { class: 'cal-pop' },
      h('div', { class: 'cal-py' },
        h('button', { class: 'cal-arw', type: 'button', onclick: () => { cal.y--; paint(); }, html: icon('chevLeft', 14) }),
        h('b', null, String(cal.y)),
        h('button', { class: 'cal-arw', type: 'button', onclick: () => { cal.y++; paint(); }, html: icon('chevRight', 14) })),
      h('div', { class: 'cal-pg' }, MONTHS_SHORT.map((mn, i) => h('button', { type: 'button', class: 'cal-pm' + (i === cal.m ? ' on' : ''),
        onclick: () => { cal.m = i; calPick = false; paint(); } }, mn)))) : null;
    const monthWrap = h('div', { style: { position: 'relative' } },
      h('button', { class: 'cal-m', type: 'button', onclick: () => { calPick = !calPick; paint(); } }, monthName + ' ▾'),
      pop);
    clear(calCard);
    calCard.append(
      h('div', { class: 'p-ch', style: { alignItems: 'center' } },
        h('h3', null, 'Dispatch calendar'),
        h('div', { class: 'cal-nav' },
          h('button', { class: 'cal-arw', type: 'button', onclick: move(-1), html: icon('chevLeft', 14) }),
          monthWrap,
          h('button', { class: 'cal-arw', type: 'button', onclick: move(1), html: icon('chevRight', 14) }),
          h('button', { class: 'cal-today', type: 'button', onclick: goToday }, 'Today'))),
      grid);
  }

  function paintLegends() {
    const phaseCount = (ph) => ALL.filter((r) => r.phase === ph).length;
    clear(legendCard);
    legendCard.append(
      h('div', { class: 'p-ch' }, h('div', null, h('h3', null, 'Date legends'), h('p', null, 'Click to filter')), h('span', { class: 'hint' }, '')),
      h('div', { class: 'p-leg' },
        h('div', { class: 'sep' }, 'Phase'),
        PH_ORDER.map((ph) => h('button', { type: 'button', class: state.phase === ph ? 'on' : '', onclick: () => togglePhase(ph) },
          h('i', { style: { background: PH[ph] } }), PH_LABEL[ph], h('b', null, phaseCount(ph)))),
        h('div', { class: 'sep' }, 'Status'),
        ['OVERDUE', 'OPEN', 'COMPLETED', 'CANCELLED'].map((g) => h('button', { type: 'button', class: state.group === g ? 'on' : '', onclick: () => toggleGroup(g) },
          h('i', { style: { background: GR[g] } }), GR_LABEL[g], h('b', null, count(g))))));
  }

  /* ---------- 4. Orders table ---------- */
  const tableCard = h('div', { class: 'p-card p-tablecard' });
  stack.append(tableCard);
  const filterNote = h('span', { class: 'hint' });
  const viaChip = h('span', { class: 'fb-chip' });
  const stSel = h('select', { class: 'fb-sel', 'aria-label': 'Status' },
    [['', 'All status'], ['OVERDUE', 'Delayed'], ['OPEN', 'Pending'], ['COMPLETED', 'Completed'], ['CANCELLED', 'Cancelled']].map(([v, t]) => h('option', { value: v }, t)));
  const stgSel = h('select', { class: 'fb-sel', 'aria-label': 'Stage' },
    [h('option', { value: '' }, 'All stages'), ...O.STEPS.map((st) => h('option', { value: st.code }, st.code + ' ' + st.short))]);
  stSel.addEventListener('change', () => { state.group = stSel.value; state.phase = ''; viaLabel = stSel.value ? GROUP_VIA[stSel.value] : 'All orders'; paint(); });
  stgSel.addEventListener('change', () => { state.step = stgSel.value; state.group = ''; state.phase = ''; viaLabel = stgSel.value ? 'Stage ' + stgSel.value : 'All orders'; paint(); });
  const filterBar = h('div', { class: 'fb' }, h('span', { class: 'fb-lab' }, 'Filter'), viaChip, stSel, stgSel,
    h('button', { class: 'fb-clear', type: 'button', onclick: () => reset() }, 'Clear'));
  function syncFilterBar(n) {
    viaChip.textContent = viaLabel + ' · ' + n + ' orders';
    stSel.value = ['OVERDUE', 'OPEN', 'COMPLETED', 'CANCELLED'].includes(state.group) ? state.group : '';
    stgSel.value = state.step || '';
  }
  const tableHost = h('div');
  tableCard.append(h('div', { class: 'p-ch', style: { alignItems: 'center' } }, h('div', { style: { display: 'flex', alignItems: 'baseline', gap: '10px', flexWrap: 'wrap' } }, h('h3', null, 'All orders')), filterBar), tableHost);

  const table = AP.table(h('div'), {
    rows: ALL, pageSize: 8, searchPlaceholder: 'Search order, party or PO…',
    exportName: 'o2d-orders', sortKey: 'received', sortDir: 'desc', rowKey: (r) => r.o.id,
    onRowClick: (r) => openOrder(r),
    columns: [
      { key: 'sno', label: 'S.No.', value: (r) => SNO.get(r.o.id), render: (r) => h('span', { style: { color: 'var(--text-muted)' } }, SNO.get(r.o.id)) },
      { key: 'so', label: 'Order', primary: true,
        value: (r) => (r.o.soNo || r.o.id) + ' ' + O.party(r.o.partyId).name,
        render: (r) => h('div', null,
          h('div', { style: { fontWeight: 600 } }, r.o.soNo || r.o.id),
          h('div', { class: 'muted', style: { fontSize: '12px' } }, O.party(r.o.partyId).name)) },
      { key: 'received', label: 'Received', value: (r) => r.o.receivedAt, render: (r) => fmt.dateShort(r.o.receivedAt) },
      { key: 'cur', label: 'Current step', value: (r) => (r.cur ? r.cur.code : ''),
        render: (r) => r.cur ? h('span', null, h('code', null, r.cur.code), ' ', O.step(r.cur.code).short) : h('span', { class: 'muted' }, 'Closed') },
      { key: 'owner', label: 'Owner', value: (r) => (r.cur ? (AP.person(r.cur.doerId) || {}).name || '' : ''),
        render: (r) => r.cur ? AP.personChip(r.cur.doerId) : '—' },
      { key: 'prog', label: 'Progress', value: (r) => r.prog, render: (r) => AP.progress(r.prog) },
      { key: 'value', label: 'Value', align: 'right', value: (r) => r.m.value, render: (r) => fmt.moneyFull(r.m.value) },
      { key: 'status', label: 'Status', value: (r) => GR_LABEL[r.group],
        render: (r) => r.group === 'OVERDUE' ? AP.toneChip('danger', 'Delayed')
          : r.group === 'OPEN' ? AP.toneChip('info', 'In progress')
          : r.group === 'COMPLETED' ? AP.toneChip('ok', 'Completed')
          : AP.toneChip('neutral', 'Cancelled') },
    ],
  });
  tableHost.appendChild(table.el);

  /* ---------- Drawer ---------- */
  const rowStyle = { display: 'grid', gridTemplateColumns: '54px 1fr auto', gap: '10px', alignItems: 'center', padding: '8px 10px', borderRadius: '10px', background: 'var(--surface-2)', border: '1px solid var(--border)', fontSize: '13px' };
  function openOrder(r) {
    const body = h('div', null,
      h('div', { class: 'kgrid', style: { '--cols': '4', gridTemplateColumns: 'repeat(4, minmax(0,1fr))', marginBottom: '16px' } },
        AP.kpiCard({ label: 'Ordered', value: fmt.num(r.m.ordered), icon: 'layers', tone: 'info', sub: 'Units' }),
        AP.kpiCard({ label: 'Dispatched', value: fmt.num(r.m.dispatched), icon: 'check', tone: 'ok', sub: fmt.pct(r.m.fulfil) + ' done' }),
        AP.kpiCard({ label: 'Balance', value: fmt.num(r.m.openBalance), icon: 'activity', tone: r.m.openBalance ? 'warn' : 'ok', sub: 'Still to ship' }),
        AP.kpiCard({ label: 'Value', value: fmt.money(r.m.value), icon: 'file', tone: 'info', sub: 'Order value' })),
      h('h4', { style: { margin: '4px 0 8px', fontSize: '13px' } }, 'Items'),
      h('div', null, r.o.lines.map((l) => {
        const s = O.sku(l.skuId);
        return h('div', { style: rowStyle }, h('code', null, s.code || '—'), h('span', null, s.name), h('small', null, fmt.num(l.qty) + ' × ₹' + fmt.num(l.rate)));
      })),
      h('h4', { style: { margin: '16px 0 8px', fontSize: '13px' } }, 'Steps'),
      h('div', null, r.p.steps.map((s) => {
        const meta = O.step(s.code) || { short: s.code };
        return h('div', { style: rowStyle }, h('code', null, s.code), h('span', null, meta.short), O.chipFor(s));
      })));
    AP.drawer({ title: r.o.soNo || r.o.id, subtitle: O.party(r.o.partyId).name + ' · received ' + fmt.dateTime(r.o.receivedAt), body, actions: [{ label: 'Close' }] });
  }

  /* ---------- State ---------- */
  function scrollToList() { tableCard.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  function toggleGroup(g) { const on = state.group === g; state.group = on ? '' : g; state.phase = ''; viaLabel = on ? 'All orders' : GROUP_VIA[g]; paint(); scrollToList(); }
  function togglePhase(ph) { const on = state.phase === ph; state.phase = on ? '' : ph; state.group = ''; viaLabel = on ? 'All orders' : PH_LABEL[ph]; paint(); scrollToList(); }
  function toggleDay(ts) { const on = state.day === ts; state.day = on ? null : ts; viaLabel = on ? 'All orders' : new Date(ts).toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }); paint(); scrollToList(); }
  function toggleSku(sku) { const on = state.sku === sku; state.sku = on ? '' : sku; state.group = ''; state.phase = ''; viaLabel = on ? 'All orders' : 'SKU ' + O.sku(sku).code; paint(); scrollToList(); }
  function reset() { kpiSel = ''; state.group = ''; state.phase = ''; state.day = null; state.step = ''; state.sku = ''; viaLabel = 'All orders'; paint(); }

  function paint() {
    paintKpis();
    paintDelay();
    paintStage();
    const list = filtered();
    paintOverview(list);
    paintCalendar();
    decorateX();
    table.setRows(list);
    const parts = [];
    if (state.group) parts.push(GR_LABEL[state.group]);
    if (state.phase) parts.push(PH_LABEL[state.phase]);
    if (state.day !== null) parts.push(new Date(state.day).toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }));
    filterNote.textContent = parts.length ? 'Filter: ' + parts.join(' · ') + ' · ' + list.length + ' orders' : 'Showing all ' + ALL.length + ' orders';
    syncFilterBar(list.length);
  }

  paint();
})();

</script>
</body>
</html>
