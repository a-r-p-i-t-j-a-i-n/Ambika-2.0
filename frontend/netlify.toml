[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy API + uploads to the backend so the browser only ever talks to the same
# HTTPS origin (Netlify forwards server-side) — avoids mixed-content blocking of the
# http:// backend and any CORS issues. ⚠️ Change the target URL here to switch backends.
# These MUST come before the SPA fallback below (Netlify uses first-match).
[[redirects]]
  from = "/api/*"
  to = "http://32.236.114.49:3006/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "http://32.236.114.49:3006/uploads/:splat"
  status = 200
  force = true

# SPA fallback — same as public/_redirects, kept here for visibility. MUST stay last.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived cache for hashed assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Always revalidate the SPA shell.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Update poller — must never be cached, or clients won't see new deploys.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Baseline security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
