name: Deploy to EC2

# CI/CD for Ambika Global (AGL) — deploys to the SHARED EC2 host 3.105.199.228.
#
#   Backend  → pm2 process "ambika-backend" on 127.0.0.1:3006 (also reachable directly)
#   Frontend → static dist served by nginx on :3005
#   Access   → http://3.105.199.228:3005
#
# ⚠️  THE BOX IS SHARED with 8 other tenants (jjerp, ld_erp, nashermiles, nia,
#     rajputana, sparsh, surgenesis, theknowcart). Every step below is scoped
#     to /home/ubuntu/ambika_2.0 and to our own pm2 process and nginx site.
#     The single cross-tenant action is `systemctl reload nginx`, which is why
#     `nginx -t` must pass FIRST — a reload with a bad config would take every
#     other tenant down with us.
#
# The frontend is built on the GitHub runner (the box has ~1.6 GB RAM free
# across 9 apps; a vite build there would risk OOM-ing a neighbour).
#
# Runtime data is preserved by rsync excludes: backend/.env, node_modules and
# uploads are never touched by --delete.
#
# Required repo secrets:
#   EC2_HOST     → 3.105.199.228
#   EC2_USER     → ubuntu
#   EC2_SSH_KEY  → contents of ERP-Projects-New.pem
#   (VITE_API_URL is NOT a secret here — the frontend talks to nginx
#    same-origin at /api/v1, so it is hardcoded below.)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

env:
  APP_DIR: /home/ubuntu/ambika_2.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          # Same-origin: the browser calls /api/v1/... and nginx proxies it to
          # 127.0.0.1:3006. No CORS, no mixed content, no baked-in IP to change
          # when the box moves.
          echo "VITE_API_URL=/api/v1" > .env.production
          npm ci
          npm run build:prod

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ensure target directories exist
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "mkdir -p ${{ env.APP_DIR }}/backend ${{ env.APP_DIR }}/frontend/dist ${{ env.APP_DIR }}/deploy"

      - name: Deploy backend source (preserve .env / node_modules / uploads)
        run: |
          # The leading slashes on /.env and /uploads MATTER. An unanchored
          # 'uploads' matches at ANY depth, which silently drops
          # src/common/uploads/ — the upload routes app.js imports — and the
          # backend then dies at boot with ERR_MODULE_NOT_FOUND. node_modules
          # stays unanchored on purpose: nested ones should go too.
          rsync -az --delete \
            --exclude='node_modules' \
            --exclude='/.env' \
            --exclude='/uploads' \
            -e "ssh -i ~/.ssh/deploy_key" \
            backend/ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.APP_DIR }}/backend/"

      - name: Deploy frontend build
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.APP_DIR }}/frontend/dist/"

      - name: Deploy ops config (nginx site + pm2 ecosystem)
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key" \
            deploy/ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.APP_DIR }}/deploy/"

      - name: Guard — refuse to start without a .env
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            if [ ! -f '"${{ env.APP_DIR }}"'/backend/.env ]; then
              echo "::error::'"${{ env.APP_DIR }}"'/backend/.env is missing."
              echo "Copy deploy/server.env.template there once, by hand, then re-run."
              exit 1
            fi
          '

      - name: Install deps & start/reload backend
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            set -e
            cd '"${{ env.APP_DIR }}"'/backend
            npm install --omit=dev --no-audit --no-fund
            # startOrReload, not reload: the first deploy has no process yet.
            pm2 startOrReload '"${{ env.APP_DIR }}"'/deploy/ecosystem.config.cjs --update-env
            pm2 save
          '

      - name: Install nginx site (validate before reloading — shared box!)
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            set -e
            sudo cp '"${{ env.APP_DIR }}"'/deploy/nginx.conf /etc/nginx/sites-available/ambika
            sudo ln -sf /etc/nginx/sites-available/ambika /etc/nginx/sites-enabled/ambika
            # If this fails, every tenant on the box keeps running the old config.
            if ! sudo nginx -t; then
              echo "::error::nginx config test failed — unlinking and leaving nginx untouched."
              sudo rm -f /etc/nginx/sites-enabled/ambika
              exit 1
            fi
            sudo systemctl reload nginx
          '

      - name: Health check (from inside the box — 3006 is not open in the SG)
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            for i in $(seq 1 15); do
              code=$(curl -s -m 5 -o /dev/null -w "%{http_code}" http://127.0.0.1:3006/api/health || true)
              echo "attempt $i -> $code"
              if [ "$code" = "200" ]; then
                echo "Backend healthy."
                # Prove nginx is actually serving the SPA + proxying the API.
                echo "nginx :3005 -> $(curl -s -m 5 -o /dev/null -w "%{http_code}" http://127.0.0.1:3005/)"
                echo "nginx api  -> $(curl -s -m 5 -o /dev/null -w "%{http_code}" http://127.0.0.1:3005/api/health)"
                exit 0
              fi
              sleep 4
            done
            echo "::error::Backend did not become healthy. Last 40 log lines:"
            pm2 logs ambika-backend --lines 40 --nostream || true
            exit 1
          '
