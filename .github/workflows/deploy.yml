name: Deploy to EC2

# CI/CD for Ambika Global (AGL) — deploys to the shared EC2 host.
#   • Backend  → pm2 process "ambika-backend"  on :3006
#   • Frontend → pm2 serve (static dist)        on :3008
#
# The frontend is built on the GitHub runner (offloads the work from the
# small 2-core box) and the artifacts are rsynced over SSH. Backend source
# is rsynced too, then `npm install` + `pm2 reload` run remotely.
#
# Runtime data on the box is preserved by rsync excludes: backend/.env,
# backend/node_modules and backend/uploads are never touched by --delete.
#
# Required repo secrets:
#   EC2_HOST      → public IP / DNS of the instance
#   EC2_USER      → ssh user (ubuntu)
#   EC2_SSH_KEY   → contents of the .pem private key
#   VITE_API_URL  → baked into the frontend build (http://<host>:3006/api/v1)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race onto the box.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > .env.production
          npm ci
          npm run build:prod

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy backend source (preserve .env / node_modules / uploads)
        run: |
          rsync -az --delete \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='uploads' \
            -e "ssh -i ~/.ssh/deploy_key" \
            backend/ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/ambika-global/backend/"

      - name: Deploy frontend build
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/ambika-global/frontend/dist/"

      - name: Install deps & reload services
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            set -e
            cd /var/www/ambika-global/backend
            npm install --omit=dev --no-audit --no-fund
            pm2 reload ambika-backend --update-env
            pm2 reload ambika-frontend
            pm2 save
            echo "Deploy complete: $(pm2 pid ambika-backend) / $(pm2 pid ambika-frontend)"
          '

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "http://${{ secrets.EC2_HOST }}:3006/api/health" || echo 000)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "Backend health check did not return 200 (port may be closed in the security group; the deploy itself still ran)."
