# Ambika Global (AGL) ERP — tenant nginx site on shared host 3.105.199.228
#
# ⚠️  THIS BOX IS SHARED. One nginx serves 8 other tenants (jjerp, ld_erp,
#     nashermiles, rajputana, sparsh, surgenesis, theknowcart). Therefore:
#       • never add `default_server` to any listener here — name/port matching
#         is what keeps other tenants' traffic theirs;
#       • never listen on a port another site already owns. In use by others:
#         80, 443, 3000, 4000, 4001, 5000, 5001, 5003, 8000, 8005, 8081,
#         8082, 8084, 8086. We take 3005.
#
#   Frontend: static dist served by nginx on :3005  (no pm2 serve process)
#   Backend : pm2 process "ambika-backend" on :3006
#   Access  : http://3.105.199.228:3005
#
#   ⚠️  Ports 3005 and 3006 must be opened for inbound TCP in the EC2 security
#       group — both are closed today. Until then the site is reachable only
#       from inside the box. The SG currently allows 22, 80, 443, 8005, 8081,
#       8082, 8084, 8086.
#
#   The browser only ever talks to :3005. The frontend is built with
#   VITE_API_URL=/api/v1, so API calls are same-origin and nginx proxies them
#   to :3006 — no CORS, and no baked-in IP to chase when the box moves.
#
# Installed by .github/workflows/deploy.yml:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ambika
#   sudo ln -sf /etc/nginx/sites-available/ambika /etc/nginx/sites-enabled/ambika
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 3005;
    server_name _;

    client_max_body_size 25M;   # backend accepts 10mb JSON + file uploads

    root  /home/ubuntu/ambika_2.0/frontend/dist;
    index index.html;

    # ── SPA shell: must always revalidate, or users get a stale bundle ──
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }

    # ── Update poller: never cache, or clients never see a new deploy ──
    location = /version.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }

    # ── Hashed assets: immutable, cache forever ──
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|ico|png|jpg|jpeg|gif|webp|avif|map)$ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # ── Socket.IO — needs the upgrade dance or realtime silently dies ──
    # server.js attaches socket.io to the same HTTP server, default path.
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── API — /api/ (not /api/v1/) so /api/health is covered too ──
    location /api/ {
        proxy_pass         http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Files the backend serves off disk (attachment previews) ──
    location /uploads/ {
        proxy_pass       http://127.0.0.1:3006;
        proxy_set_header Host $host;
    }

    location ~ /\. { deny all; }

    # ── SPA fallback. MUST stay last — anything not matched above is a
    #    client-side route, so hand back index.html for React Router. ──
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }

    access_log /var/log/nginx/ambika.access.log;
    error_log  /var/log/nginx/ambika.error.log;
}
